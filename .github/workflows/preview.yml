name: Preview

# Renders one draft (with the real narrator voice) without uploading it or touching
# the queue, and puts a small copy on the "previews" branch so it can be watched.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Drafts file, e.g. content/drafts/explainer-bunker.yaml"
        type: string
        required: true
      id:
        description: "Entry id in that file"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2-dev pkg-config
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Render
        run: python tools/render_draft.py "${{ inputs.file }}" "${{ inputs.id }}" "output/${{ inputs.id }}.mp4"
      - name: Publish a small copy to the previews branch
        run: |
          mkdir -p /tmp/pv
          ffmpeg -loglevel error -y -i "output/${{ inputs.id }}.mp4" -vf scale=720:-2 -c:v libx264 -crf 24 \
            -preset veryfast -c:a aac -b:a 128k "/tmp/pv/${{ inputs.id }}.mp4"
          cd /tmp/pv
          git init -q -b previews
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Preview ${{ inputs.id }} (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
