name: Daily Short

on:
  schedule:
    # Checks every hour and posts whatever is due (see schedule.slots_utc in
    # config.yaml: 6 slots a day). GitHub often starts scheduled runs late or
    # skips them; the hourly check catches up on any missed slot, never posting
    # more than schedule.max_per_day per YouTube quota day.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: make the video but don't upload it"
        type: boolean
        default: true
      videos:
        description: "How many videos from the top of the queue to make (and post, if not a test)"
        type: number
        default: 1

permissions:
  contents: write   # to record posted videos back into content/

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: How many videos are due?
        id: due
        run: |
          pip install -q PyYAML
          if [ "${{ github.event_name }}" = "schedule" ]; then
            COUNT=$(python -m shorts.schedule)
          else
            COUNT="${{ inputs.videos }}"
            COUNT="${COUNT:-1}"
          fi
          echo "Videos to make now: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg and fonts
        if: steps.due.outputs.count != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libegl1 libgl1-mesa-dri

      - name: Install Python packages
        if: steps.due.outputs.count != '0'
        run: pip install -r requirements.txt

      - name: Get gameplay footage
        if: steps.due.outputs.count != '0'
        # Videos attached to the repo's "gameplay" release (see SETUP.md).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download gameplay --dir assets/gameplay --skip-existing \
            || echo "No 'gameplay' release: using the clips in assets/gameplay."

      - name: Cache voice models
        if: steps.due.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: .cache
          key: voice-models-v2

      - name: Make and post video
        if: steps.due.outputs.count != '0'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m shorts run --dry-run --count "${{ steps.due.outputs.count }}"
          else
            python -m shorts run --count "${{ steps.due.outputs.count }}"
          fi

      - name: Make voice samples (test runs only)
        if: inputs.dry_run == true
        run: python -m shorts voices

      - name: Save the video so you can watch it
        if: always() && steps.due.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the voice samples
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples-${{ github.run_number }}
          path: output/voice-samples/
          retention-days: 7
          if-no-files-found: ignore

      - name: Record posted videos
        if: success() && inputs.dry_run != true && steps.due.outputs.count != '0'
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record posted Short ($(date -u +%F))"
          git pull --rebase
          git push
