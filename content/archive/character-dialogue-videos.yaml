- id: rule-of-72
  title: The rule of 72 (how long until your money doubles) 📈
  dialogue:
  - - dave
    - How long does it take to double my money?
  - - pip
    - Use the rule of 72. Divide 72 by your yearly return.
  - - dave
    - Okay, my savings account pays 1 percent.
  - - pip
    - 72 divided by 1. That's 72 years.
  - - dave
    - I'll be a hundred and something!
  - - pip
    - At 8 percent a year, it's about 9 years. At 12 percent, about 6.
  - - dave
    - So the number at the bottom matters way more than I thought.
  - - pip
    - Exactly. Small differences in growth turn into massive differences over time. It's an estimate, not a promise, but it's surprisingly accurate.
