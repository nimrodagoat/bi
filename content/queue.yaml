- id: loop-trick
  title: The loop trick that makes Shorts get replayed 🔁
  dialogue:
    - [pip, "One trick is the loop. The last sentence flows straight back into the first one."]
    - [dave, "Why does that help?"]
    - [pip, "Because people watch it again without noticing. More rewatching tells the algorithm the video is worth showing."]
    - [dave, "That's sneaky."]
    - [pip, "It's just good editing. But it only works if the video is worth watching in the first place."]
    - [dave, "And a strong hook helps too?"]
    - [pip, "Hook, short sentences, no filler. Every second has to earn the next one."]
    - [dave, "Okay, but seriously. How do some Shorts get way more views than they should?"]
