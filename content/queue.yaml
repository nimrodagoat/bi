- id: rule-of-72
  title: The rule of 72 (how long until your money doubles) 📈
  dialogue:
    - [dave, "How long does it take to double my money?"]
    - [pip, "Use the rule of 72. Divide 72 by your yearly return."]
    - [dave, "Okay, my savings account pays 1 percent."]
    - [pip, "72 divided by 1. That's 72 years."]
    - [dave, "I'll be a hundred and something!"]
    - [pip, "At 8 percent a year, it's about 9 years. At 12 percent, about 6."]
    - [dave, "So the number at the bottom matters way more than I thought."]
    - [pip, "Exactly. Small differences in growth turn into massive differences over time. It's an estimate, not a promise, but it's surprisingly accurate."]
    - [dave, "Follow for more math that's actually useful."]
  search_terms: [stock chart, calculator, money growth, savings]
  tags: [rule of 72, money facts, compound interest, finance basics, personal finance]

- id: cash-is-rare
  title: Most money doesn't actually exist 🏦
  dialogue:
    - [dave, "I keep all my money under my mattress. Real money."]
    - [pip, "Fun fact. Most of the world's money doesn't exist as cash at all."]
    - [dave, "Then where is it?"]
    - [pip, "It's numbers in bank computers. In the United States, physical cash is only about a tenth of the money supply."]
    - [dave, "So when I check my bank app..."]
    - [pip, "You're looking at a record in a database. When you pay with a card, no coins or bills move anywhere. Just numbers changing."]
    - [dave, "So my mattress is the only real bank."]
    - [pip, "Your mattress doesn't pay interest, and it's not insured."]
    - [dave, "Follow us. I'm going to go check under the mattress."]
  search_terms: [bank, credit card payment, cash money, server room]
  tags: [money facts, banking, digital money, finance, did you know]

- id: dollar-bills-cotton
  title: Dollar bills aren't made of paper 💵
  dialogue:
    - [dave, "I washed my jeans and there was a twenty in the pocket. It survived!"]
    - [pip, "Of course it did. Dollar bills aren't made of paper."]
    - [dave, "Then what are they made of?"]
    - [pip, "75 percent cotton and 25 percent linen. Basically fabric."]
    - [dave, "So my money is a tiny T-shirt."]
    - [pip, "In a way. That's why it doesn't fall apart in the wash like normal paper."]
    - [dave, "How long does a bill last?"]
    - [pip, "A one dollar bill lasts around six and a half years. A hundred dollar bill lasts over twenty years, because people spend it less."]
    - [dave, "Follow, and check your pockets before laundry day."]
  search_terms: [dollar bills, washing machine, cash money, cotton field]
  tags: [money facts, dollar bill, fun facts, did you know, cash]

