- id: hook-first
  title: Why nobody watches your Shorts past 1 second ⏱️
  dialogue:
    - [dave, "Nobody watches my Shorts past the first second."]
    - [pip, "What's your first line?"]
    - [dave, "Hey guys, welcome back to my channel."]
    - [pip, "That's the problem. On Shorts, people decide almost instantly whether to keep watching."]
    - [dave, "So what should I say instead?"]
    - [pip, "Start with the most interesting part. A surprising fact, a bold question, or show the result first."]
    - [dave, "Like, this pizza cost a billion dollars."]
    - [pip, "Exactly. Hook first, explain second. Never warm up."]
    - [dave, "Follow. See? I didn't say hey guys."]
