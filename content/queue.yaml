- id: compound-100-a-month
  title: What $100 a month turns into 🤯
  dialogue:
    - [dave, "A hundred dollars a month is nothing. Why bother saving it?"]
    - [pip, "Let's do the math. 100 dollars a month for 40 years is 48,000 dollars."]
    - [dave, "Okay, that's something."]
    - [pip, "Now imagine it grows 7 percent a year, every year. You'd end up with roughly 260,000."]
    - [dave, "Where did the extra two hundred thousand come from?"]
    - [pip, "Compound growth. Your money earns money, and then that money earns money too."]
    - [dave, "So time does most of the work."]
    - [pip, "Exactly. Real returns go up and down, so nothing is guaranteed. But starting early makes a huge difference."]
    - [dave, "Follow, I'm starting today. Well, tomorrow."]
  search_terms: [piggy bank, growing plant, money stack, calendar]
  tags: [compound interest, money facts, saving money, personal finance, finance basics]

