- id: zimbabwe-trillion
  title: The $100 TRILLION bill you can buy for a few dollars 🤑
  dialogue:
    - [dave, "I want to be a trillionaire."]
    - [pip, "Easy. In 2008, Zimbabwe printed a 100 trillion dollar bill."]
    - [dave, "Where do I get one?"]
    - [pip, "You can buy one online for a few dollars."]
    - [dave, "Wait, why is a trillion dollars so cheap?"]
    - [pip, "Hyperinflation. The government printed so much money that at the worst point, prices were doubling about every day."]
    - [dave, "Every day?"]
    - [pip, "Shop prices changed by the hour. In the end, the country stopped using its own currency."]
    - [dave, "So printing more money doesn't make everyone rich."]
    - [pip, "Correct. It just makes money worth less."]
    - [dave, "Follow for more money facts."]
