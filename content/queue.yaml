# Videos waiting to be posted, top to bottom. The daily job takes the first one.
# Each entry:
#   id            unique name (letters, numbers, dashes)
#   niche         optional; overrides the niche in config.yaml for this video
#   title         YouTube title (max 100 characters)
#   contact       text stories: the name at the top of the chat (e.g. Mom)
#   messages      text stories: list of [me, "text"] / [them, "text"], in order
#   me / them     optional voices for a text story (male, female, young_male, ...)
#   dialogue      a conversation: list of [speaker, line]; speakers are the
#                 characters in config.yaml (aim for 35-55 seconds, ~100-140 words)
#   script        OR: one narrator reads this text instead of a dialogue
#   shots         stickman stories (format: stickman): list of scenes, each with
#                 what the narrator says; see shorts/stick/README.md
#   search_terms  words used to find matching stock footage, one per scene
#   tags          YouTube tags
#   description   optional; generated from the script if missing

- id: new-star-1
  format: stickman
  series: NEW STAR
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: KELDER HILL
  title: I'm the night assistant at an observatory. A new star appeared below the horizon ⭐
