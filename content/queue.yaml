    - [pip, "Not necessarily. There's a famous idea called one thousand true fans."]
    - [dave, "Only a thousand?"]
    - [pip, "Writer Kevin Kelly argued that if a thousand people each spend 100 dollars a year on your work, that's 100,000 dollars."]
    - [dave, "That's way more realistic than a million."]
    - [pip, "The key word is true. People who buy what you make. Not just people who scroll past."]
    - [dave, "So views are nice, but real fans pay the bills."]
    - [pip, "Exactly. Build a small crowd that really cares."]
    - [dave, "Follow, and you're officially fan number one."]
