- id: price-ends-in-99
  title: Why everything costs $9.99 🏷️
  dialogue:
    - [dave, "Why does everything cost nine ninety-nine?"]
    - [pip, "Because your brain reads the first number and rounds down."]
    - [dave, "No way. I'm smarter than that."]
    - [pip, "Is nine ninety-nine closer to nine or ten?"]
    - [dave, "Nine. Obviously."]
    - [pip, "It's one cent away from ten. That's called the left digit effect. Studies show prices ending in nine often sell better."]
    - [dave, "So stores are tricking me with one cent."]
    - [pip, "One cent that makes things feel cheaper. Online creators use the same trick, selling things for 19 dollars instead of 20."]
    - [dave, "Follow. This video is worth nine ninety-nine."]
