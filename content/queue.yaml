- id: inflation-100-dollars
  title: Your $100 is shrinking right now 📉
  dialogue:
    - [dave, "My grandpa says a hundred dollars used to buy a lot."]
    - [pip, "He's right. What 100 dollars bought in the year 2000 would cost around 190 dollars today."]
    - [dave, "So my money is shrinking?"]
    - [pip, "Its buying power is. That's inflation. Prices rise a little every year, and it adds up."]
    - [dave, "How much is a little?"]
    - [pip, "The Federal Reserve aims for about 2 percent a year. At 2 percent, prices double in roughly 36 years."]
    - [dave, "The rule of 72 again!"]
    - [pip, "You were listening. I'm proud of you."]
    - [dave, "Follow, because apparently I'm learning things now."]
