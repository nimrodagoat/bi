- id: lamp-room-1
  format: stickman
  series: LAMP ROOM
  day: 1
  day_label: NIGHT
  meter_label: LAMP
  place: PENTRE PIT
  title: "I'm the night watchman at an old coal mine. One lamp tag has been missing since 1938 ⛏️"
  tags: [stickman, animation, horror, story, mine, mystery]
  shots:
    - scene: room
      time: "10:00 PM"
      place: THE LAMP ROOM
      light: 100
      window: false
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job at Pentre Pit, an old coal mine that's now a museum. Ten PM to six AM, watching the lamp room at the top of the old tunnel."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Dilys · museum manager", cue: dilys, y: 470}
      radio_label: "PHONE · DILYS"
      say:
        - "Dilys, the museum manager, phones with the rules."
        - radio: "Three rules. Check the tag board every hour. Never go past the second gate. And if you hear tapping in the rock, always tap back."
    - scene: title
      say: "Lamp Room. Night one."
    - scene: inventory
      time: "10:15 PM"
      place: THE TAG BOARD
      light: 99
      rule: {n: 1, text: Check the tag board every hour}
      items:
        - {icon: key, count: 46, label: brass tags on the board, cue: board}
      total: {text: "Hook 47 is empty", cue: empty}
      say: "Rule number one. Every miner took a brass tag going down, and hung it back coming up. An empty hook meant someone was still underground. Forty six tags. Hook forty seven is empty."
    - scene: hallway
      time: "11:00 PM"
      place: THE OLD TUNNEL
      light: 98
      lights: "on"
      timbers: true
      wall: "#4a3f36"
      floor: "#2a231d"
      carpet: "#3a2f26"
      ceiling: "#1a1512"
      exit_color: "#3a3028"
      rule: {n: 2, text: Never pass the second gate}
      say: "Rule number two. Never go past the second gate. The old seam behind it isn't safe. Tonight's goal: keep watch until six."
    - scene: hallway
      time: "3:00 AM"
      light: 90
      lights: "off"
      dark: 0.6
      timbers: true
      wall: "#4a3f36"
      floor: "#2a231d"
      carpet: "#3a2f26"
      ceiling: "#1a1512"
      exit_color: "#ffcf7a"
      rule: {n: 3, text: Always tap back}
      sfx: [{name: knock, at: tap, gain: 0.7}, {name: knock, at: "75%", gain: 0.7}]
      heartbeat: lamp
      say: "Rule number three. At three AM, you hear it. Tap, tap, tap, inside the rock. You tap back three times. And far down the tunnel, past the last gate, a small yellow lamp light comes on."
    - scene: choice
      time: "3:01 AM"
      base: {scene: hallway, lights: "off", dark: 0.6, timbers: true, wall: "#4a3f36", floor: "#2a231d", carpet: "#3a2f26", ceiling: "#1a1512", exit_color: "#ffcf7a"}
      question: "Walk to the gate or stay by the board?"
      options:
        - {text: Walk to the gate, cue: walk}
        - {text: Stay by the board, cue: stay}
      say: "Do you walk down to the gate... or stay by the tag board?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night two."

