- id: batching-content
  title: How to make 10 Shorts in the time it takes to make 1 🎬
  dialogue:
    - [dave, "I spend all day making one Short."]
    - [pip, "Try batching. Write or film ten in one session instead of one a day."]
    - [dave, "Why is that faster?"]
    - [pip, "Every time you switch tasks, your brain needs time to get back into focus. Batching means you set up once and stay in the zone."]
    - [dave, "So, one day for writing, one day for editing."]
    - [pip, "Exactly. Then you schedule them to post automatically."]
    - [dave, "Wait. That's what we do."]
    - [pip, "Correct. This video was probably made weeks ago."]
    - [dave, "Follow us from the past."]
