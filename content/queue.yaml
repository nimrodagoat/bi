# Videos waiting to be posted, top to bottom. The daily job takes the first one.
# Each entry:
#   id            unique name (letters, numbers, dashes)
#   niche         optional; overrides the niche in config.yaml for this video
#   title         YouTube title (max 100 characters)
#   contact       text stories: the name at the top of the chat (e.g. Mom)
#   messages      text stories: list of [me, "text"] / [them, "text"], in order
#   me / them     optional voices for a text story (male, female, young_male, ...)
#   dialogue      a conversation: list of [speaker, line]; speakers are the
#                 characters in config.yaml (aim for 35-55 seconds, ~100-140 words)
#   script        OR: one narrator reads this text instead of a dialogue
#   shots         stickman stories (format: stickman): list of scenes, each with
#                 what the narrator says; see shorts/stick/README.md
#   search_terms  words used to find matching stock footage, one per scene
#   tags          YouTube tags
#   description   optional; generated from the script if missing

- id: the-toll-1
  format: stickman
  series: THE TOLL
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: HARROW BRIDGE
  title: I'm the night toll-keeper on an old bridge. At 3 AM something asked what the toll was 🌉
  tags:
  - stickman
  - animation
  - horror
  - story
  - bridge
  - toll
  shots:
  - scene: room
    time: 10:00 PM
    place: THE TOLL BOOTH
    light: 100
    wall: '#4a5a4e'
    furniture: false
    desk: true
    clock: true
    you:
      x: 0.4
      action: idle
      facing: 1
    say: You take the night job in the toll booth on Harrow Bridge. Ten PM to six AM. One barrier, one cash box, and a long drop into the gorge below.
  - scene: radio
    time: 10:05 PM
    true: phone
    chip:
      text: Mr. Quill · bridge trust
      cue: quill
      y: 470
    radio_label: PHONE · MR. QUILL
    say:
    - Mr. Quill, from the bridge trust, phones with the rules.
    - radio: Three rules. Everyone pays the toll, no exceptions. Never cross the bridge yourself after midnight. And if something asks for the Others price, choose very, very carefully.
  - scene: title
    say: The Toll. Night one.
  - scene: street
    time: 10:20 PM
    place: HARROW BRIDGE
    light: 99
    stop: 0
    sea: true
    dark: 0.55
    you:
      light: true
      facing: 1
    rule:
      n: 1
      text: Everyone pays the toll
    chip:
      text: 'WALKERS 10p · CARTS 20p · OTHERS: ASK THE KEEPER'
      cue: board
      y: 520
    say: Rule number one. Everyone pays. The old toll board says walkers, ten pence. Carts, twenty pence. And at the bottom, Others. Ask the keeper.
  - scene: street
    time: 11:00 PM
    light: 98
    stop: 0
    sea: true
    dark: 0.6
    you:
      light: true
      facing: -1
    rule:
      n: 2
      text: Never cross after midnight
    say: 'Rule number two. After midnight, never cross the bridge yourself. Not even to the middle. Tonight''s goal: keep the barrier until six.'
  - scene: street
    time: 3:00 AM
    light: 92
    stop: 0
    sea: true
    dark: 0.7
    you:
      light: true
      facing: 1
    people:
    - x: 0.7
      action: idle
      facing: -1
      color: '#3a3a44'
      stare: true
      cue: coat
    rule:
      n: 3
      text: 'Others'' toll: choose carefully'
    heartbeat: coat
    say: Rule number three. At three AM, a tall figure in a long dark coat stands at the barrier. Its eyes shine in your flashlight. It speaks softly. Others. What's the toll?
  - scene: choice
    time: 3:01 AM
    base:
      scene: street
      stop: 0
      sea: true
      dark: 0.7
      you:
        light: true
        facing: 1
      people:
