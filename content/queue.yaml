- id: powerball-odds
  title: Your real odds of winning the lottery 🎰
  dialogue:
    - [dave, "I'm buying a lottery ticket. I can feel it this time."]
    - [pip, "The odds of winning the Powerball jackpot are about 1 in 292 million."]
    - [dave, "So there's a chance."]
    - [pip, "You're far more likely to be struck by lightning in your lifetime."]
    - [dave, "What if I buy ten tickets?"]
    - [pip, "Then it's ten in 292 million. Still basically zero."]
    - [dave, "Okay, then why does anyone play?"]
    - [pip, "For the dream. On average, players get back much less than they spend. That's how lotteries make money."]
    - [dave, "Follow. I'm keeping my ticket money this week."]
