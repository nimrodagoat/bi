# LOW WATER (6 parts). You are the night operator at Haldon Dam, ten PM to six
# AM. Under the reservoir lies Low Ashby, a village flooded in 1959.
# The meter is the WATER level (red line = 90).
# Cast: you (night operator), Mr. Hollis (the chief engineer, only on the
# radio), and the man with the lantern (from the drowned village).
# The idea, said plainly: before the valley was flooded, St. Anne's church bell
# was taken out and hung in the dam's tower. Every night it rings by itself,
# calling the villagers, but it's up in the tower, not down at home, so they
# can't rest. Hollis says the bell is what keeps them in the water.
# Twist: you lower the bell into the reservoir. The villagers walk home, and by
# dawn the water drains away, showing Low Ashby whole in the mud. Sting: Hollis
# on the radio: "Every reservoir in the country was built over something." Far
# away, other bells start to ring.
- id: low-water-1
  format: stickman
  series: LOW WATER
  day: 1
  day_label: NIGHT
  meter_label: WATER
  place: HALDON DAM
  title: "I'm the night operator at a dam. At 2 AM a bell rang from under the water 🔔"
  tags: [stickman, animation, horror, story, dam, reservoir]
  shots:
    - scene: room
      time: "10:00 PM"
      light: 60
      wall: "#4e5a5e"
      furniture: false
      desk: true
      monitors: true
      clock: true
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job at Haldon Dam. Ten PM to six AM. One control room, and a reservoir as wide as a town."
    - scene: radio
      time: "10:05 PM"
      on: radio
      chip: {text: "Mr. Hollis · chief engineer", cue: hollis, y: 470}
      radio_label: "RADIO · MR. HOLLIS"
      say:
        - "Mr. Hollis, the chief engineer, gives you the rules on the radio."
        - radio: "Three rules. Keep the water under the red line. Never open the sluice gates at night. And if you hear a bell, don't look at the water."
    - scene: title
      say: "Low Water. Night one."
    - scene: map
      time: "10:20 PM"
      place: RESERVOIR PLAN
      light: 60
      route: [[0.3, 0.98], [0.3, 0.3]]
      route_cue: 0
      route_end: village
      stops:
        - {x: 0.3, y: 0.85, label: "Haldon Dam", cue: 0}
        - {x: 0.3, y: 0.65, label: "Reservoir", cue: reservoir}
        - {x: 0.3, y: 0.45, label: "Low Ashby · flooded 1959", ghost: true, cue: village}
      say: "Under the reservoir is a village. Low Ashby. Flooded in nineteen fifty nine. The houses are still down there."
    - scene: room
      time: "10:40 PM"
      light: 61
      wall: "#4e5a5e"
      furniture: false
      desk: true
      monitors: true
      clock: true
      rule: {n: 1, text: Keep the water under the red line}
      you: {x: 0.45, action: idle, facing: 1}
      say: "Rule number one. The water meter must stay under the red line, at ninety."
    - scene: street
      time: "11:00 PM"
      place: THE DAM WALL
      light: 62
      stop: 0
      sea: true
      dark: 0.6
      you: {light: true, facing: 1}
      rule: {n: 2, text: Never open the sluice gates at night}
      say: "Rule number two. Never open the sluice gates at night, whatever you hear. Tonight's goal: walk the wall every hour, until six."
    - scene: street
      time: "2:00 AM"
      light: 66
      stop: 0
      sea: true
      dark: 0.7
      you: {light: true, facing: 1}
      rule: {n: 3, text: "If you hear a bell, don't look at the water"}
      sfx: [{name: tick, at: bell}, {name: tick, at: again}]
      heartbeat: again
      say: "At two AM, on the wall, you hear it. A church bell. Rule number three. Don't look at the water. But it's coming from the water. Then again."
    - scene: street
      time: "2:05 AM"
      light: 70
      stop: 0
      sea: true
      dark: 0.7
      you: {light: true, facing: 1}
      people: [{x: 0.72, action: walk, facing: -1, color: "#d9b36b", drift: -60, cue: lantern}]
      say: "Out of the dark water, a man walks up the dam steps, carrying a lantern. Dripping. He says: open the gates. Let us go home."
    - scene: choice
      time: "2:06 AM"
      base: {scene: street, stop: 0, sea: true, dark: 0.7, you: {light: true, facing: 1}, people: [{x: 0.62, action: idle, facing: -1, color: "#d9b36b"}]}
      question: "Talk to him or radio Hollis?"
      options:
        - {text: Talk, cue: talk}
        - {text: Radio, cue: radio}
      say: "Do you talk to him... or radio Mr. Hollis?"
    - scene: endcard
      time: "2:06 AM"
      hold: 1.6
      say: "Follow for night two."

