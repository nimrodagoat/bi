# HIGH TIDE (6 parts). You are the caretaker of Gull Rock, a tiny island with
# one stone cottage, joined to land by a causeway the sea covers every night.
# Cast: you (new caretaker), Moira (old ferrywoman, visits at low tide),
# the Walker (a tall shape that walks out of the sea at high tide and knocks).
# Core idea, said plainly: the Walker can only come in if you open the door at
# high tide or your lamp goes out. Moira always knocks four times, the Walker
# three. Twist: the Walker is the last caretaker; whoever opens the door takes
# his place, and on the last night he copies Moira's knock and voice.
- id: high-tide-1
  format: stickman
  series: HIGH TIDE
  day: 1
  day_label: NIGHT
  meter_label: OIL
  place: GULL ROCK
  title: "I'm the caretaker of a tiny island. Every night the sea cuts it off 🌊"
  tags: [stickman, animation, horror, island, hightide, story]
  shots:
    - scene: street
      time: "6:40 PM"
      place: THE CAUSEWAY
      light: 100
      sea: true
      dark: 0.55
      pace: walk
      you: {light: false}
      say: "You take a job nobody else wants. Six nights as caretaker of Gull Rock, a tiny island with one stone cottage."
    - scene: map
      time: "6:45 PM"
      route: [[0.2, 0.92], [0.45, 0.6], [0.62, 0.3]]
      route_cue: 0
      route_end: causeway
      stops:
        - {x: 0.2, y: 0.92, left: true, label: Mainland}
      target: {label: "Gull Rock", cue: rock, icon: pin}
      fog_zone: {level: [0.0, 0.75], cue: sea, label: HIGH TIDE}
      say: "Every night, the sea covers the only path back to land. A stone causeway, half a mile long."
    - scene: title
      say: "High tide. Night one."
    - scene: closeup
      object: phone
      time: "7:10 PM"
      place: COTTAGE
      light: 100
      screen: Note on the table
      sub: From the last caretaker
      message: "BE INSIDE BEFORE THE TIDE."
      message_cue: inside
      rule: {n: 1, text: Be inside before the tide}
      say: "The last caretaker left you a note. Rule number one. Be inside before the tide covers the causeway. Every night."
    - scene: room
      place: COTTAGE
      time: "7:15 PM"
      light: 100
      wall: "#6b5a48"
      lamp: true
      clock: true
      rule: {n: 2, text: Keep the lamp lit}
      you: {x: 0.3, action: idle, facing: 1}
      say: "Rule number two. Keep the lamp by the window lit all night. It must never go out."
    - scene: inventory
      time: "7:20 PM"
      light: 100
      items:
        - {icon: bottle, count: 3, label: lamp oil, cue: oil}
        - {icon: matches, count: 1, label: matches, cue: matches}
        - {icon: can, count: 4, label: soup, cue: soup}
      total: {text: "6 nights to go", cue: six}
      say: "Three bottles of lamp oil. One box of matches. Four cans of soup. Six nights to go."
    - scene: street
      time: "11:40 PM"
      place: THE CAUSEWAY
      light: 100
      sea: true
      dark: 0.7
      pace: run
      fog: {top: 0.9, rise: [0.92, 0.7], cue: rising, density: 1.0, color: "#2f5d7a"}
      you: {light: true}
      say: "But on your first night, you lose track of time out on the causeway. The water starts rising around your feet."
    - scene: room
      place: COTTAGE
      time: "11:58 PM"
      light: 98
      wall: "#6b5a48"
      lamp: true
      clock: true
      door_open: [[0.8, 0], [0, slam]]
      sfx: [{name: hit, at: slam}]
      you: {x: 0.85, to: 0.6, go: 0, arrive: "40%", facing: -1}
      say: "You make it inside, and slam the door, just as the sea swallows the path."
    - scene: room
      place: COTTAGE
      time: "12:00 AM"
      light: 96
      wall: "#6b5a48"
      lamp: true
      clock: true
      dark: 0.5
      sfx: [{name: knock, at: three}, {name: knock, at: slow}, {name: knock, at: knocks}]
      you: {x: 0.6, action: idle, facing: 1, action_at: {knocks: scared}}
      say: "At midnight, high tide. Then three slow knocks on the door."
    - scene: room
      place: COTTAGE
      time: "12:01 AM"
      light: 96
      wall: "#6b5a48"
      lamp: true
      clock: true
      dark: 0.55
      creatures: [{x: 0.5, ground: 800, scale: 0.68, action: lurk, facing: 1, cue: tall}]
      you: {x: 0.3, action: scared, facing: 1}
      camera: {zoom: [1.0, 1.25], focus: [0.5, 0.42]}
      heartbeat: dripping
      say: "Through the window, you see it. Something tall, standing in the water, dripping. Right at your door."
    - scene: choice
      time: "12:02 AM"
      base:
        scene: room
        wall: "#6b5a48"
        lamp: true
        clock: true
        dark: 0.55
        creatures: [{x: 0.5, ground: 800, scale: 0.68, action: lurk, facing: 1}]
        you: {x: 0.3, action: scared, facing: 1}
      question: "Answer or stay quiet?"
      options:
        - {text: Answer, cue: answer}
        - {text: Stay quiet, cue: quiet}
      say: "Do you answer the door... or stay quiet?"
    - scene: endcard
      time: "12:02 AM"
      hold: 1.6
      say: "Follow for night two."

