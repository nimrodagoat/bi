# DEEP END (6 parts). You are the night attendant at Harlow Baths, an old
# indoor swimming pool, ten PM to six AM.
# Cast: you (night attendant), Gwen (the day manager, only on the phone), and
# the swimmer in the white cap, who swims lengths in the dark at three AM.
# The idea, said plainly: in 1974 a swimmer called June tried a hundred-length
# charity swim at night. Someone lost count, the lights went out at length 99,
# and she was never found. She still swims, and asks "how many was that?"
# Answer wrong and the deep end pulls you in to start again.
# Twist: you count her to a hundred and she finally climbs out. Then Gwen
# admits she was the girl counting for June in 1974: she lost count, and has
# hired a night attendant every year since to fix it. Sting: one splash, and
# the tally board flips to 1.
- id: deep-end-1
  format: stickman
  series: DEEP END
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: HARLOW BATHS
  title: "I'm the night attendant at an old swimming pool. At 3 AM someone was swimming 🏊"
  tags: [stickman, animation, horror, story, swimmingpool, deepend]
  shots:
    - scene: room
      time: "10:00 PM"
      light: 100
      wall: "#3f6f7a"
      furniture: false
      desk: true
      monitors: true
      clock: true
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job at Harlow Baths, an old swimming pool. Ten PM to six AM. Mop the floors, check the water, lock up. Easy."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Gwen · day manager", cue: gwen, y: 470}
      radio_label: "PHONE · GWEN"
      say:
        - "Gwen, the day manager, phones with the rules."
        - radio: "Three rules, pet. Never switch the pool lights on after midnight. If you hear swimming, don't count out loud. And never go past the deep end rope."
    - scene: title
      say: "Deep End. Night one."
    - scene: hallway
      time: "10:30 PM"
      place: THE POOL
      light: 99
      lights: "on"
      wall: "#4f8fa8"
      floor: "#1d5a74"
      carpet: "#2b7a99"
      ceiling: "#16323e"
      exit_color: "#9fe3ff"
      rule: {n: 1, text: No pool lights after midnight}
      say: "Rule number one. After midnight, the pool lights stay off. You only use your flashlight."
    - scene: hallway
      time: "10:40 PM"
      light: 98
      lights: "on"
      wall: "#4f8fa8"
      floor: "#1d5a74"
      carpet: "#2b7a99"
      ceiling: "#16323e"
      exit_color: "#9fe3ff"
      rule: {n: 2, text: Never count lengths out loud}
      say: "Rule number two. If you hear someone swimming, never count the lengths out loud. Not even in a whisper."
    - scene: hallway
      time: "10:50 PM"
      light: 97
      lights: "on"
      wall: "#4f8fa8"
      floor: "#1d5a74"
      carpet: "#2b7a99"
      ceiling: "#16323e"
      exit_color: "#9fe3ff"
      rule: {n: 3, text: Never pass the deep end rope}
      say: "Rule number three. Never go past the rope at the deep end. Tonight's goal: clean up, lock up, and get through to six."
    - scene: inventory
      time: "11:00 PM"
      light: 96
      items:
        - {icon: key, count: 4, label: door keys, cue: keys}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 2, label: batteries, cue: batteries}
      total: {text: "Gwen opens up at 6 AM", cue: six}
      say: "Four door keys. One flashlight. Two spare batteries."
    - scene: cctv
      time: "3:00 AM"
      cam: "CAM 02 · POOL"
      place: THE OFFICE
      light: 80
      view: {scene: hallway, lights: "off", dark: 0.6, wall: "#4f8fa8", floor: "#1d5a74", carpet: "#2b7a99", ceiling: "#16323e", exit_color: "#9fe3ff", figures: [{who: person, z: 4.5, to_z: 3.0, x: 0.1, cue: cap}]}
      sfx: [{name: whoosh, at: splash, gain: 0.5}]
      heartbeat: cap
      say: "At three AM, you hear a splash. Then another. On the pool camera, in the dark, someone is swimming lengths. A woman, in an old white swimming cap."
    - scene: choice
      time: "3:01 AM"
      base: {scene: cctv, cam: "CAM 02 · POOL", view: {scene: hallway, lights: "off", dark: 0.6, wall: "#4f8fa8", floor: "#1d5a74", carpet: "#2b7a99", ceiling: "#16323e", exit_color: "#9fe3ff", figures: [{who: person, z: 3.0, x: 0.1}]}}
      question: "Go and look or phone Gwen?"
      options:
        - {text: Look, cue: look}
        - {text: Phone Gwen, cue: phone}
      say: "Do you go and look... or phone Gwen?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night two."

