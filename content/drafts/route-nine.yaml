      say: "In the new dark patch by pump four, the tall man is standing. Ten steps closer than before."
    - scene: choice
      time: "3:32 AM"
      base: {scene: street, dark: 0.8, stop: 0, lurkers: 1, you: {light: true}}
      question: "Fix the light or stay inside?"
      options:
        - {text: Fix it, cue: fix}
        - {text: Stay inside, cue: stay}
      say: "Do you go out and change the bulb... or stay inside, and let him get closer?"
    - scene: endcard
      time: "3:32 AM"
      hold: 1.6
      say: "Follow for night three."

