      route: [[0.1, 0.8], [0.9, 0.8], [0.9, 0.2], [0.1, 0.2], [0.1, 0.8]]
      route_cue: 0
      route_end: lights
      lamps: {cue: "end+5"}
      target: {label: "Store", cue: 0, icon: pin}
      say: "Tonight's goal: keep all eight forecourt lights on, until sunrise. As long as they're on, he can't come near the pumps."
    - scene: map
