      say: "Dale adds rule number three. Never take anything from him, either. Not even help. Whatever he offers, it always costs something."
    - scene: room
      time: "10:05 PM"
      light: 100
      wall: "#5c6a58"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.42, action: idle, facing: 1}
