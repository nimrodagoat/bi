# ROUTE NINE (6 parts). You work the night shift at Last Stop Gas, the only
# station on Route 9, ten PM to six AM.
# Cast: you (night clerk), Dale (the owner, on the phone), the Hitchhiker (a tall
# man who waits just outside the forecourt lights).
# Core idea, said plainly: he can't step into the light, and he can only come
# inside if you sell him something; whoever buys something here must follow the
# station's rules. Goal: six nights with the lights on and nothing sold.
# Twist (a clever win): on the last night you sell him the night shift. He's
# inside, but now rule one binds him: he can never leave the light.
- id: route-nine-1
  format: stickman
  series: ROUTE NINE
  day: 1
  day_label: NIGHT
  meter_label: LIGHTS
  place: LAST STOP GAS
  title: "I work nights at the only gas station on Route 9. Rule 1: keep the lights on ⛽"
  tags: [stickman, animation, horror, gasstation, routenine, story]
  shots:
    - scene: street
      time: "9:55 PM"
      place: ROUTE 9
      light: 100
      pace: walk
      dark: 0.6
      you: {light: false}
      say: "You take the night shift nobody wants. Last Stop Gas, the only station on Route 9. Ten PM to six AM."
    - scene: closeup
      object: phone
      time: "10:00 PM"
      place: LAST STOP GAS
      screen: Note on the till
      sub: From Dale, the owner
      message: "KEEP THE FORECOURT\nLIGHTS ON. ALL NIGHT."
      message_cue: lights
      rule: {n: 1, text: Keep the lights on}
      say: "The owner, Dale, left a note on the till. Rule number one. Keep the forecourt lights on. All night."
    - scene: title
      say: "Route nine. Night one."
    - scene: room
      time: "10:05 PM"
      light: 100
      wall: "#5c6a58"
      furniture: false
      desk: true
      clock: true
      rule: {n: 2, text: Sell nothing after 3 AM}
      you: {x: 0.42, action: idle, facing: 1}
      say: "Rule number two. After three AM, sell nothing. Not gas, not coffee. To anyone."
    - scene: inventory
      time: "10:10 PM"
      light: 100
      items:
        - {icon: key, count: 1, label: store key, cue: key}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 3, label: spare bulbs, cue: three}
      total: {text: "8 forecourt lights", cue: eight}
      say: "One store key. One flashlight. Three spare bulbs. And eight lights over the forecourt."
    - scene: map
      time: "10:15 PM"
      route: [[0.1, 0.8], [0.9, 0.8], [0.9, 0.2], [0.1, 0.2], [0.1, 0.8]]
      route_cue: 0
      route_end: dark
      stops:
        - {x: 0.5, y: 0.5, label: "Pumps 1-4", cue: pumps}
      target: {label: "Store", cue: 0, icon: pin}
      say: "The forecourt is a square of light around the pumps. Past the edge, the road is completely dark."
    - scene: room
      time: "3:10 AM"
      light: 98
      wall: "#5c6a58"
      furniture: false
      desk: true
      clock: true
      dark: 0.4
      creatures: [{x: 0.48, ground: 800, scale: 0.68, action: lurk, facing: 1, cue: tall}]
      you: {x: 0.3, action: idle, facing: 1}
      camera: {zoom: [1.0, 1.25], focus: [0.5, 0.42]}
      say: "At three ten, you see him through the window. A tall man, standing right at the edge of the light. Thumb out, like a hitchhiker."
    - scene: room
      time: "3:12 AM"
      light: 98
      wall: "#5c6a58"
      furniture: false
      desk: true
      clock: true
      dark: 0.4
      creatures: [{x: 0.48, ground: 800, scale: 0.68, action: lurk, facing: 1}]
      sfx: [{name: knock, at: taps}]
      you: {x: 0.3, action: scared, facing: 1}
      heartbeat: coffee
      say: "He taps on the glass, and smiles. Just one coffee, friend. I can pay."
    - scene: choice
      time: "3:13 AM"
      base:
        scene: room
        wall: "#5c6a58"
        furniture: false
        desk: true
        clock: true
        dark: 0.4
        creatures: [{x: 0.48, ground: 800, scale: 0.68, action: lurk, facing: 1}]
        you: {x: 0.3, action: scared, facing: 1}
      question: "Sell him a coffee or say no?"
      options:
        - {text: Sell it, cue: sell}
        - {text: Say no, cue: say}
      say: "Do you sell him a coffee... or say no?"
    - scene: endcard
      time: "3:13 AM"
      hold: 1.6
      say: "Follow for night two."

