# CALL SIGN (6 parts). You are the night radio operator in the one-room tower
# of Carra airfield, a tiny island strip, ten PM to six AM.
# Cast: you (night operator), Morag (the airfield owner, on the phone), and
# Mike Echo Four: a pilot's voice on the radio at 3 AM, a mail plane lost in
# fog in 1953, still asking to land.
# The idea, said plainly: in 1953 the runway was an old grass strip on the
# WEST side, lit by paraffin lamps. The new runway (1960) is on the EAST. The
# pilot circles looking for lamps that aren't there.
# Rule 3 (never clear him to land) dates from 1961, when Morag's father cleared
# him and was found at dawn soaked in seawater.
# Twist: you light the old strip; he says "I see lamps" and goes down. At dawn,
# low tide shows a plane's tail in the sand off the end of the old strip,
# exactly where the lamps point. He never needed to land. He needed to be
# found. The switched-off radio crackles once: "Thank you, Carra."
- id: call-sign-1
  format: stickman
  series: CALL SIGN
  day: 1
  day_label: NIGHT
  meter_label: POWER
  place: CARRA AIRFIELD
  title: "I'm the night radio operator at a tiny island airfield. At 3 AM a plane asked to land ✈️"
  tags: [stickman, animation, horror, story, airfield, mystery]
  shots:
    - scene: room
      time: "10:00 PM"
      place: THE TOWER
      light: 100
      wall: "#4e5c66"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job in the tower at Carra, a tiny island airfield. Ten PM to six AM. One runway, one radio, and one old generator for the lights."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Morag · airfield owner", cue: morag, y: 470}
      radio_label: "PHONE · MORAG"
      say:
        - "Morag, who owns the airfield, phones with the rules."
        - radio: "Three rules. Keep the runway lights on till dawn. Answer every call on the radio. And if Mike Echo Four calls, never clear it to land. Never."
    - scene: title
      say: "Call Sign. Night one."
    - scene: street
      time: "11:00 PM"
      place: THE RUNWAY
      light: 99
      stop: 0
      sea: true
      dark: 0.55
      floodlights: lights
      you: {light: true, facing: 1}
      rule: {n: 1, text: Runway lights on till dawn}
      say: "Rule number one. The runway lights stay on till dawn. If the generator runs dry, the island goes dark. Tonight's goal: keep them burning until six."
    - scene: radio
      time: "1:00 AM"
      on: radio
      chip: {text: "Fishing boat · Kestrel", cue: kestrel, y: 470}
      radio_label: "RADIO · CHANNEL 1"
      rule: {n: 2, text: Answer every call}
      say:
        - "Rule number two. Answer every call on the radio. At one AM, a fishing boat checks the weather. You answer. Easy."
    - scene: room
      time: "3:00 AM"
      place: THE TOWER
      light: 94
      wall: "#4e5c66"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      dark: 0.5
      you: {x: 0.35, action: scared, facing: 1}
      window_lights: [{x: 0.3, y: 0.3, color: "#ff5a4a", cue: lights, n: 2, drift: 0.4}]
      rule: {n: 3, text: "Never clear Mike Echo Four"}
      heartbeat: lights
      say:
        - "Rule number three. At three AM, the radio crackles. An old engine hums somewhere in the fog. Small red lights circle past the window."
        - radio: "Carra tower, this is Mike Echo Four. Requesting permission to land."
    - scene: choice
      time: "3:01 AM"
      base: {scene: room, wall: "#4e5c66", furniture: false, desk: true, clock: true, window_view: forest, dark: 0.5, you: {x: 0.35, action: scared, facing: 1}, window_lights: [{x: 0.3, y: 0.3, color: "#ff5a4a", n: 2}]}
      question: "Refuse him or ask who he is?"
      options:
        - {text: Refuse, cue: refuse}
        - {text: Ask who, cue: ask}
      say: "Do you refuse him... or ask who he is?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night two."

