        - {x: 0.3, y: 0.45, label: "One tap · come up", ghost: true, cue: one}
      say: "She explains the old tap code. Miners talked through the rock. Three taps means, I hear you. Two taps means, stay where you are. And one tap means, come up."
    - scene: room
      time: "3:20 AM"
      place: THE LAMP ROOM
      light: 88
      window: false
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.45, action: scared, facing: 1}
      heartbeat: torn
      say: "Tonight's goal: find out why he never comes up. Every watchman for eighty eight years has only ever said, I hear you. Not once has anyone told him to come up. Then you notice. In the lamp book, the page after the roof fall is torn out."
    - scene: choice
      time: "3:21 AM"
      base: {scene: room, window: false, wall: "#5a4a3a", furniture: false, desk: true, clock: true}
      question: "Find the torn page or tap once tonight?"
      options:
        - {text: Find the page, cue: page}
        - {text: Tap once, cue: once}
      say: "Do you search for the torn page... or tap just once tonight?"
    - scene: endcard
      time: "3:21 AM"
      hold: 1.6
      say: "Follow for night five."

