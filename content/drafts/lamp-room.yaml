      base: {scene: hallway, lights: "off", dark: 0.65, timbers: true, wall: "#4a3f36", floor: "#2a231d", carpet: "#3a2f26", ceiling: "#1a1512", exit_color: "#ffcf7a", figures: [{who: person, z: 2.6, x: 0.0}]}
