      total: {text: "Fresh coal dust on hook 47", cue: dust}
      heartbeat: dust
      say: "When you check the board at six, there's fresh black coal dust on hook forty seven. Like a hand reached for it in the dark, and couldn't quite touch it."
    - scene: choice
