      say: "Follow for the last night."

- id: lamp-room-6
  format: stickman
  series: LAMP ROOM
  day: 6
  day_label: NIGHT
  meter_label: LAMP
  place: PENTRE PIT
  title: "I tapped once on the rock. After 88 years, the boy in the mine came up ⛏️"
  tags: [stickman, animation, horror, story, mine, mystery]
  shots:
    - scene: hallway
      recap: true
      time: "3:01 AM"
      light: 91
      lights: "off"
      dark: 0.65
      timbers: true
      wall: "#4a3f36"
      floor: "#2a231d"
      carpet: "#3a2f26"
      ceiling: "#1a1512"
      exit_color: "#ffcf7a"
      figures: [{who: person, z: 2.6, x: 0.0}]
      say: "Last time, you found out Tom was told to stay put in nineteen thirty eight, and nobody ever told him he could come up."
    - scene: title
      say: "Lamp Room. The last night."
    - scene: hallway
      time: "3:02 AM"
      light: [90, 70]
      lights: "off"
      dark: 0.6
      timbers: true
      wall: "#4a3f36"
      floor: "#2a231d"
      carpet: "#3a2f26"
      ceiling: "#1a1512"
      exit_color: "#ffcf7a"
      figures: [{who: person, z: 2.6, to_z: 1.0, x: 0.0, cue: walks}]
      sfx: [{name: knock, at: once, gain: 0.9}, {name: click, at: creaks, gain: 0.6}]
      say: "Tonight's goal: bring him home. You put your hand on the cold rock, and tap once. Come up. Gate two creaks open on its own. And Tom walks up the tunnel, lamp swinging, leading a small grey pony."
    - scene: inventory
      time: "3:10 AM"
      place: THE TAG BOARD
      light: 68
      items:
        - {icon: key, count: 47, label: brass tags on the board, cue: board}
      total: {text: "47 of 47. Everyone is up.", cue: everyone}
      say: "He stops at the board, smiles, and hangs tag forty seven on its hook. Click. For the first time since nineteen thirty eight, every tag is back. Everyone is up."
    - scene: room
      time: "6:00 AM"
      place: THE LAMP ROOM
      light: 66
      window: false
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.35, action: idle, facing: 1}
      people: [{x: 0.65, action: idle, facing: -1, color: "#8a6a8a"}]
      say: "At six, Dilys arrives. You show her the torn page. She reads the name. Evan Morgan. Her great grandfather. He never forgave himself, she says. So he made every watchman tap three. I hear you. He just couldn't bear to say, come up."
    - scene: room
      time: "6:05 AM"
      light: 64
      window: false
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.35, action: idle, facing: 1}
      people: [{x: 0.65, action: idle, facing: -1, color: "#8a6a8a"}]
      heartbeat: stall
      say: "Then you both look at Seren's old pony stall, locked since nineteen thirty eight. The straw inside is warm. And on the stall door hangs a brand new brass tag. Number forty eight."
    - scene: choice
      time: "6:06 AM"
      base: {scene: room, window: false, wall: "#5a4a3a", furniture: false, desk: true, clock: true, you: {x: 0.35, action: idle, facing: 1}, people: [{x: 0.65, action: idle, facing: -1, color: "#8a6a8a"}]}
