  day_label: NIGHT
  meter_label: LAMP
  place: PENTRE PIT
  title: "Miners used a tap code underground. Three taps meant 'I hear you.' One tap meant something else ⛏️"
  tags: [stickman, animation, horror, story, mine, mystery]
  shots:
    - scene: hallway
      recap: true
      time: "3:01 AM"
      light: 91
      lights: "off"
      dark: 0.65
      timbers: true
      wall: "#4a3f36"
      floor: "#2a231d"
      carpet: "#3a2f26"
      ceiling: "#1a1512"
      exit_color: "#ffcf7a"
      figures: [{who: person, z: 2.6, x: 0.0}]
      say: "Last night, Tom Pryce, the pony boy lost in nineteen thirty eight, came right up to gate two."
    - scene: title
      say: "Lamp Room. Night four."
    - scene: radio
      time: "3:05 AM"
      on: phone
      chip: {text: "Dilys · museum manager", cue: dilys, y: 470}
      radio_label: "PHONE · DILYS"
      say:
        - "You phone Dilys. She goes very quiet."
        - radio: "Don't open the gate. And don't ever tap just once. My grandmother made every watchman promise. Three taps, always three."
    - scene: map
      time: "3:10 AM"
      place: THE TAP CODE
      light: 89
      route: [[0.3, 0.98], [0.3, 0.2]]
      route_cue: 0
      route_end: one
      stops:
        - {x: 0.3, y: 0.85, label: "Three taps · I hear you", cue: three}
