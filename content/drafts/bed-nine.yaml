# BED NINE (6 parts). You are the winter night keeper at the Ashgrove
# Glasshouse, eight PM to six AM. The meter is the HEAT inside the glass.
# Cast: you (night keeper), Dr. Hale (head botanist, only on the radio),
# Tobias (an old man with garden shears at the door), and the moonflower in
# Bed Nine, which blooms once every hundred years and opens at dawn after the
# sixth night.
# The idea, said plainly: when the moonflower opens it hums a song; whoever
# hears the whole song falls asleep and never wakes. Moss, a keeper from the
# last bloom in 2006 (a smaller, "practice" bloom), is still asleep behind
# the palms.
# Twist / clever win: the shears can't cut it, but the flower needs warmth to
# open, and rule one (keep the heat above ten) was there to wake it. You switch
# the heaters off and open the doors to the frost; the bud closes, the
# sleepers wake. Sting: Dr. Hale writes your name in the log under "keeper,
# next bloom: 2126" and says keepers here live a long time.
- id: bed-nine-1
  format: stickman
  series: BED NINE
  day: 1
  day_label: NIGHT
  meter_label: HEAT
  place: ASHGROVE GLASSHOUSE
  title: "I'm the night keeper at a glasshouse. At 2 AM a man with shears wanted in 🌙"
  tags: [stickman, animation, horror, story, glasshouse, plants]
  shots:
    - scene: room
      time: "8:00 PM"
      light: 100
      wall: "#3f5a42"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the winter night shift at the Ashgrove Glasshouse. Eight PM to six AM. Ten thousand plants, three old heaters, and snow outside the glass."
    - scene: radio
      time: "8:05 PM"
      on: radio
      chip: {text: "Dr. Hale · head botanist", cue: hale, y: 470}
      radio_label: "RADIO · DR. HALE"
      say:
        - "Dr. Hale, the head botanist, gives you the rules on the radio."
        - radio: "Three rules. Keep the heat above ten degrees. Never touch Bed Nine. And keep the door locked, whoever knocks."
    - scene: title
      say: "Bed Nine. Night one."
    - scene: hallway
      time: "8:30 PM"
      place: BED NINE
      light: 99
      lights: "on"
      wall: "#2f4a32"
      floor: "#1e2a1c"
      carpet: "#4a3524"
      ceiling: "#16201a"
      exit_color: "#b388ff"
      rule: {n: 1, text: Keep the heat above ten degrees}
      say: "Rule number one. Keep the heat above ten degrees, all night. If it gets cold, the plants die."
    - scene: hallway
      time: "8:40 PM"
      light: 98
      lights: "on"
      wall: "#2f4a32"
      floor: "#1e2a1c"
      carpet: "#4a3524"
      ceiling: "#16201a"
      exit_color: "#b388ff"
      rule: {n: 2, text: Never touch Bed Nine}
      say: "Rule number two. Never touch Bed Nine. At the end of the path, there's a single huge bud, glowing purple. A moonflower. It blooms once every hundred years. This week."
    - scene: inventory
      time: "9:00 PM"
      light: 97
      items:
        - {icon: can, count: 3, label: heater fuel, cue: fuel}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: key, count: 1, label: door key, cue: key}
      total: {text: "Dr. Hale arrives at 6 AM", cue: six}
      say: "Three cans of heater fuel. One flashlight. One key to the glass door. Tonight's goal: keep everything warm until six."
    - scene: street
      time: "2:00 AM"
      place: THE GLASS DOOR
      light: 90
      stop: 0
      dark: 0.6
      snow: true
      you: {light: true, facing: 1}
      people: [{x: 0.68, action: knock, facing: -1, color: "#c9b28a", cue: knock}]
      sfx: [{name: knock, at: knock}, {name: knock, at: shears}]
      rule: {n: 3, text: Keep the door locked}
      say: "At two AM, a knock on the glass door. Rule number three. Keep it locked, whoever it is. Outside, in the snow, stands an old man holding garden shears."
    - scene: street
      time: "2:01 AM"
      light: 89
      stop: 0
      dark: 0.6
      snow: true
      you: {light: true, facing: 1}
      people: [{x: 0.68, action: idle, facing: -1, color: "#c9b28a"}]
      heartbeat: opens
      say: "He shouts through the glass. Let me in. I have to cut that flower before it opens."
    - scene: choice
      time: "2:02 AM"
      base: {scene: street, stop: 0, dark: 0.6, snow: true, you: {light: true, facing: 1}, people: [{x: 0.68, action: idle, facing: -1, color: "#c9b28a"}]}
      question: "Let him in or keep it locked?"
      options:
        - {text: Let him in, cue: let}
        - {text: Keep it locked, cue: locked}
      say: "Do you let him in... or keep the door locked?"
    - scene: endcard
      time: "2:02 AM"
      hold: 1.6
      say: "Follow for night two."

