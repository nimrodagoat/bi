# MILK ROUND (6 parts). You take over the pre-dawn milk round in Brindle, a
# sleepy village: forty houses, three AM to dawn, one electric milk float.
# Cast: you (the new milkman), Walt (the old milkman, only on the radio from the
# dairy), Mrs. Pell (number nine, always up early), and the notes left in empty
# bottles at number twelve, a narrow house that isn't on the map.
# Twist: the notes were the real Walt, trapped inside number twelve since 1985,
# asking for milk to stay alive and for someone brave enough to fetch him. The
# voice on the radio was the house all along; its rules kept every milkman
# away. Last sting: after you save Walt, the radio voice says "new round
# tomorrow. Forty-one houses."
- id: milk-round-1
  format: stickman
  series: MILK ROUND
  day: 1
  day_label: ROUND
  meter_label: BATTERY
  place: BRINDLE VILLAGE
  title: "I took over the village milk round. One house on it isn't on the map 🥛"
  tags: [stickman, animation, horror, story, milkround, village]
  shots:
    - scene: street
      time: "3:00 AM"
      light: 100
      pace: walk
      dark: 0.6
      you: {light: true}
      say: "You take over the milk round in Brindle, a sleepy little village. Three AM start. Forty houses. One slow, humming electric milk float."
    - scene: radio
      time: "3:05 AM"
      on: radio
      chip: {text: "Walt · the old milkman", cue: walt, y: 470}
      radio_label: "RADIO · THE DAIRY"
      say:
        - "Old Walt did this round for forty years. He calls from the dairy with the rules."
        - radio: "Three rules, lad. Leave exactly what the note says. Never knock on a door. And be back before dawn."
    - scene: title
      say: "Milk Round. Round one."
    - scene: street
      time: "3:15 AM"
      light: 98
      stop: 0
      dark: 0.6
      you: {light: true, facing: 1}
      rule: {n: 1, text: Leave exactly what the note says}
      say: "Rule number one. Every house leaves a note in an empty bottle. One pint means one pint. Never more. Never less."
    - scene: street
      time: "3:30 AM"
      light: 95
      stop: 0
      dark: 0.6
      you: {light: true, facing: 1}
      rule: {n: 2, text: Never knock on a door}
      say: "Rule number two. Never knock. Not when a light is on. Not even when somebody inside calls your name."
    - scene: inventory
      time: "3:35 AM"
      light: 94
      items:
        - {icon: bottle, count: 40, label: pints of milk, cue: forty}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 1, label: float battery, cue: battery}
      total: {text: "Back by dawn · 6 AM", cue: six}
      say: "Forty pints. One flashlight. One float battery. Tonight's goal: all forty houses, and back at the dairy by six."
    - scene: map
      time: "4:40 AM"
      place: ELM ROW
      route: [[0.3, 0.9], [0.3, 0.12]]
      route_cue: 0
      route_end: thirteen
      stops:
        - {x: 0.3, y: 0.9, left: true, label: "No. 10", cue: ten}
        - {x: 0.3, y: 0.7, label: "No. 11", cue: eleven}
        - {x: 0.3, y: 0.5, label: "No. 12 ?", ghost: true, cue: twelve}
        - {x: 0.3, y: 0.3, label: "No. 13", cue: thirteen}
      say: "Elm Row is the last street. On your map, the houses go ten, eleven, thirteen. There is no number twelve."
    - scene: street
      time: "4:45 AM"
      place: ELM ROW
      light: 80
      stop: 0
      dark: 0.7
      you: {light: true, facing: 1}
      heartbeat: narrow
      chip: {text: "Note: two pints. And the boy who brings them.", cue: note, y: 520}
      say: "But tonight, between eleven and thirteen, there's a narrow, dark house. Number twelve. On the step, an empty bottle with a note. Two pints, please. And the boy who brings them."
    - scene: choice
      time: "4:46 AM"
      base: {scene: street, stop: 0, dark: 0.7, you: {light: true, facing: 1}}
      question: "Leave the milk or skip number twelve?"
      options:
        - {text: Leave the milk, cue: leave}
        - {text: Skip it, cue: skip}
      say: "Do you leave the milk... or skip number twelve?"
    - scene: endcard
      time: "4:46 AM"
      hold: 1.6
      say: "Follow for round two."

- id: milk-round-2
  format: stickman
  series: MILK ROUND
  day: 2
  day_label: ROUND
  meter_label: BATTERY
  place: ELM ROW
  title: "The house that isn't on the map left another note. Round 2 🥛"
  tags: [stickman, animation, horror, story, milkround, village]
  shots:
    - scene: street
      recap: true
      time: "4:46 AM"
      light: 80
      stop: 0
      dark: 0.7
      you: {light: true, facing: 1}
      say: "Last round, a house that isn't on the map left you a note. Two pints, and the boy who brings them."
    - scene: title
      say: "Milk Round. Round two."
    - scene: street
      time: "4:47 AM"
      light: 79
      stop: 0
      dark: 0.7
      you: {light: true, facing: 1}
      sfx: [{name: click, at: pints}]
      heartbeat: upstairs
      say: "You leave the two pints. Exactly what the note says, and nothing more. You don't knock. As you walk away, a light comes on upstairs."
    - scene: radio
      time: "4:50 AM"
      on: radio
      radio_label: "RADIO · THE DAIRY"
      rule: {n: 3, text: Never go near number twelve}
      say:
        - "You tell Walt on the radio. He goes quiet for a long time."
        - radio: "New rule, lad. Never go near number twelve again. That house isn't on our round."
    - scene: street
      time: "5:20 AM"
      light: [70, 45]
      pace: run
      dark: 0.75
      lurkers: 2
      you: {light: true}
      say: "Tonight's goal: the last fourteen houses before six. The float battery is low. And something tall follows you, roof to roof. When your flashlight finds it, it backs away."
    - scene: street
      time: "5:40 AM"
      place: NUMBER NINE
      light: 42
      stop: 0
      dark: 0.7
      you: {light: true, facing: 1}
      people: [{x: 0.65, action: idle, facing: -1, color: "#d9c7e8", cue: pell}]
      say: "At number nine, old Mrs. Pell is waiting at her door in her dressing gown. She whispers. That house took a milkman once, dear. Don't let it take you."
    - scene: room
      time: "5:59 AM"
      place: THE DAIRY
      light: 30
      wall: "#5a6a6e"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.4, action: idle, facing: 1}
      heartbeat: waiting
      chip: {text: "Note: you forgot the boy.", cue: note, y: 520}
      say: "You get back to the dairy at one minute to six. And on the dairy step, waiting for you, is an empty bottle with a note. You forgot the boy."
    - scene: choice
      time: "6:00 AM"
      base: {scene: room, wall: "#5a6a6e", furniture: false, desk: true, clock: true}
      question: "Tell Walt or keep it quiet?"
      options:
        - {text: Tell Walt, cue: tell}
        - {text: Keep it quiet, cue: quiet}
      say: "Do you tell Walt... or keep it quiet?"
    - scene: endcard
      time: "6:00 AM"
      hold: 1.6
      say: "Follow for round three."

