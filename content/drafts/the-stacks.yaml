# THE STACKS (6 parts). You work nights alone at the old Halden Library,
# shelving the returns cart and locking up.
# Cast: you (night archivist), Mrs. Pell (head librarian, leaves notes on the
# desk), the woman in the reading room (a nervous young reader).
# Core idea, said plainly: the notes on the desk warn about something that
# walks the stacks in the dark. Every night the lamps die where you walk, the
# camera glitches when you pass, and the woman is terrified of you.
# Twist: you are the night archivist who died in the 1998 fire. The notes were
# for her, the new night archivist. The thing in the dark is you.
- id: stacks-1
  format: stickman
  series: THE STACKS
  day: 1
  day_label: NIGHT
  meter_label: LAMPS
  place: HALDEN LIBRARY
  title: "I work nights alone in a 100-year-old library. Rule 1: lock the reading room 📚"
  tags: [stickman, animation, horror, library, thestacks, story]
  shots:
    - scene: hallway
      time: "10:00 PM"
      place: THE STACKS
      light: 100
      lights: "on"
      shelves: true
      wall: "#4a3a2a"
      floor: "#2a2018"
      carpet: "#5a2a24"
      ceiling: "#1e1812"
      exit_color: "#27d466"
      camera: {zoom: [1.0, 1.25], focus: [0.5, 0.45]}
      say: "You start the night job at the old Halden Library. Ten PM to six AM. Alone, with a hundred thousand books."
    - scene: closeup
      object: phone
      time: "10:05 PM"
      place: RETURNS DESK
      screen: Note on the desk
      sub: For the night archivist
      message: "LOCK THE READING ROOM\nAT MIDNIGHT."
      message_cue: lock
      rule: {n: 1, text: Lock the reading room at midnight}
      say: "On the returns desk, there's a note from Mrs. Pell, the head librarian. Rule number one. Lock the reading room at midnight."
    - scene: title
      say: "The stacks. Night one."
    - scene: hallway
      time: "10:10 PM"
      place: THE STACKS
      light: 100
      lights: "on"
      shelves: true
      wall: "#4a3a2a"
      floor: "#2a2018"
      carpet: "#5a2a24"
      ceiling: "#1e1812"
      exit_color: "#27d466"
      rule: {n: 2, text: Keep every lamp on}
      say: "Rule number two. Keep every lamp in the stacks switched on. All night. No matter what."
    - scene: inventory
      time: "10:15 PM"
      light: 100
      items:
        - {icon: key, count: 3, label: keys, cue: three}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 2, label: batteries, cue: two}
      total: {text: "1 cart to shelve", cue: cart}
      say: "Three keys. One flashlight. Two batteries. And one cart of returned books to shelve before sunrise."
    - scene: hallway
      time: "11:00 PM"
      place: THE STACKS
      light: 96
      lights: flicker
      dark: 0.5
      shelves: true
      wall: "#4a3a2a"
      floor: "#2a2018"
      carpet: "#5a2a24"
      ceiling: "#1e1812"
      exit_color: "#27d466"
      say: "At eleven, the lamps flicker every time you walk past. Old wiring, you tell yourself. The building is a hundred years old."
    - scene: room
      time: "12:00 AM"
      place: READING ROOM
      light: 94
      wall: "#5a4632"
      lamp: true
      clock: true
      people: [{x: 0.6, action: idle, facing: -1, color: "#f0b8a8", cue: someone}]
      you: {x: 0.9, to: 0.82, go: 0, arrive: "30%", facing: -1}
      say: "At midnight, you go to lock the reading room. Someone is still inside. A young woman, reading under a lamp."
    - scene: room
      time: "12:01 AM"
      light: 90
      wall: "#5a4632"
      lamp: [[true, 0], [false, switches]]
      dark: [[0.2, 0], [0.85, switches]]
      clock: true
      people: [{x: 0.6, action: idle, facing: 1, color: "#f0b8a8", action_at: {white: scared}}]
      you: {x: 0.82, action: idle, facing: -1}
      heartbeat: switches
      say: "She looks up at you. Her face goes white. And she switches off her lamp."
    - scene: choice
      time: "12:02 AM"
      base:
        scene: room
        wall: "#5a4632"
        lamp: false
        dark: 0.85
        clock: true
        people: [{x: 0.6, action: scared, facing: 1, color: "#f0b8a8"}]
        you: {x: 0.82, action: idle, facing: -1}
      question: "Lock the door or go in?"
      options:
        - {text: Lock it, cue: lock}
        - {text: Go in, cue: go}
      say: "Do you lock the door... or go in after her?"
    - scene: endcard
      time: "12:02 AM"
      hold: 1.6
      say: "Follow for night two."

