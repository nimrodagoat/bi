# LOST & FOUND (6 parts). You are the new night clerk at the Lost Property
# office under Central Station, ten PM to six AM.
# Cast: you (night clerk), Nora (the day clerk, only on the phone), the man in
# the brown coat (comes to the counter at two AM every night).
# The idea, said plainly: at night, the office also keeps lost NAMES. Tell a
# night visitor your name and the office files it, and you're forgotten.
# The man in the brown coat is Arthur Abel, the night clerk of 1974, who told a
# visitor his name. His name was filed inside his own umbrella.
# Twist: you give Arthur his name back and he walks out to the first train. But
# the office never keeps an empty shelf: your staff badge is now blank, and the
# new line in the log says "Item: a name. Owner: the night clerk."
- id: lost-and-found-1
  format: stickman
  series: LOST & FOUND
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: LOST PROPERTY
  title: "I'm the night clerk at a lost property office. At 2 AM a man asked for his name 🧳"
  tags: [stickman, animation, horror, story, lostandfound, trainstation]
  shots:
    - scene: room
      time: "10:00 PM"
      light: 100
      wall: "#6b6248"
      furniture: false
      desk: true
      clock: true
      window: false
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night shift at the Lost Property office, under Central Station. Ten PM to six AM. Just you, a counter, and a thousand forgotten things."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Nora · day clerk", cue: nora, y: 470}
      radio_label: "PHONE · NORA"
      say:
        - "Nora, the day clerk, phones with the rules."
        - radio: "Three rules, love. Log everything. Only hand things back if they can tell you what's inside. And never tell a night visitor your name."
    - scene: title
      say: "Lost and Found. Night one."
    - scene: room
      time: "10:20 PM"
      light: 99
      wall: "#6b6248"
      furniture: false
      desk: true
      clock: true
      window: false
      rule: {n: 1, text: Log every item right away}
      you: {x: 0.45, action: reach, facing: 1}
      say: "Rule number one. Log every item the moment it lands on the counter. Even if nobody brought it."
    - scene: room
      time: "10:30 PM"
      light: 98
      wall: "#6b6248"
      furniture: false
      desk: true
      clock: true
      window: false
      rule: {n: 2, text: Owners must say what's inside}
      you: {x: 0.45, action: idle, facing: 1}
      say: "Rule number two. Only give something back if the owner can tell you what's inside it. A bag. A box. A coat pocket."
    - scene: hallway
      time: "11:00 PM"
      light: 96
      lights: "on"
      shelves: true
      wall: "#5a5240"
      floor: "#2a261c"
      carpet: "#3e3a2c"
      ceiling: "#1e1b14"
      exit_color: "#c0392b"
      rule: {n: 3, text: Never tell a night visitor your name}
      say: "Rule number three. Never tell a night visitor your name. Nora didn't say why. Tonight's goal: log every item by six."
    - scene: room
      time: "1:00 AM"
      light: 90
      wall: "#6b6248"
      furniture: false
      desk: true
      clock: true
      window: false
      you: {x: 0.35, action: scared, facing: 1}
      sfx: [{name: tick, at: dripping}]
      heartbeat: dripping
      say: "At one AM, a black umbrella is lying on the counter. Still dripping. You never heard anyone come in. You log it anyway."
    - scene: room
      time: "2:00 AM"
      light: 86
      wall: "#6b6248"
      furniture: false
      desk: true
      clock: true
      window: false
      you: {x: 0.35, action: idle, facing: 1}
      people: [{x: 0.7, action: idle, facing: -1, coat: "#6b5640", cue: coat}]
      chip: {text: "\"Has anyone handed in my name?\"", cue: name, y: 520}
      say: "At two AM, a man in a long brown coat is standing at the counter. Polite. Pale. He asks: has anyone handed in my name?"
    - scene: choice
      time: "2:01 AM"
      base: {scene: room, wall: "#6b6248", furniture: false, desk: true, clock: true, window: false, people: [{x: 0.7, action: idle, facing: -1, coat: "#6b5640"}]}
      question: "Answer him or stay quiet?"
      options:
        - {text: Answer him, cue: answer}
        - {text: Stay quiet, cue: quiet}
      say: "Do you answer him... or stay quiet?"
    - scene: endcard
      time: "2:01 AM"
      hold: 1.6
      say: "Follow for night two."

