# LAST TRAIN (6 parts). You drive the last train of the night on Line 9.
# Cast: you (new night driver), Marta (night dispatcher, only on the radio),
# the man in the grey coat (a silent passenger who is always in the last seat).
# Core idea, said plainly: a station that closed in 1987, Ashgrove, comes back
# for six nights a year and wants a full train. Goal: finish six runs without
# ever opening the doors there. Twist: Marta was the 1987 dispatcher, and she
# is the one who wants out. Each part opens with a one-line recap.
- id: last-train-1
  format: stickman
  series: LAST TRAIN
  day: 1
  day_label: NIGHT
  cap: true
  meter_label: POWER
  place: LINE 9
  title: "My last train stopped at a station that isn't on the map. Night 1 🚇"
  tags: [stickman, animation, horror, subway, lasttrain, story]
  shots:
    - scene: tunnel
      time: "12:30 AM"
      light: 100
      next: "LINE 9 · LAST TRAIN"
      signal: green
      say: "You take the job nobody else wants. Driving the last train of the night on Line 9."
    - scene: radio
      time: "12:31 AM"
      on: radio
      chip: {text: "Marta · night dispatch", cue: marta, y: 470}
      say:
        - "Your dispatcher, Marta, is only ever a voice on the radio."
        - radio: "Welcome, driver. Two rules. Learn them."
    - scene: title
      say: "Last train. Night one."
    - scene: map
      time: "12:32 AM"
      route: [[0.3, 0.94], [0.3, 0.04]]
      route_cue: 0
      route_end: six
      stops:
        - {x: 0.3, y: 0.94, left: true, label: Central, cue: six}
        - {x: 0.3, y: 0.78, label: Market St, cue: six}
        - {x: 0.3, y: 0.62, label: Old Mill, cue: six}
        - {x: 0.3, y: 0.46, label: Riverside, cue: six}
        - {x: 0.3, y: 0.18, label: Canal, cue: six}
      target: {label: "Harbor · end of line", cue: six, icon: pin}
      rule: {n: 1, text: Stop only at map stations}
      say: "Rule number one. There are six stations on your map. Stop only at those six."
    - scene: train
      time: "12:34 AM"
      place: CENTRAL
      parked: true
      station: {name: CENTRAL}
      doors: {open: 0, close: "end-0.8"}
      next: "THIS IS: CENTRAL"
      rule: {n: 2, text: Count your passengers}
      passengers:
        - {x: 0.06, cue: count}
        - {x: 0.17, cue: count}
        - {x: 0.28, cue: number}
        - {x: 0.67, cue: number}
        - {x: 0.78, cue: match}
      you: {x: 0.5, action: idle, facing: 1}
      say: "Rule number two. Count your passengers at every stop. The number that gets on must match the number that gets off."
    - scene: train
      time: "12:36 AM"
      place: LINE 9
      next: "NEXT: MARKET ST"
      passengers:
        - {x: 0.06}
        - {x: 0.17, asleep: true}
        - {x: 0.28}
        - {x: 0.67}
        - {x: 0.78}
        - {x: 0.89, coat: true, facing: -1, cue: sixth}
      you: {x: 0.5, to: 0.62, go: sixth, arrive: "end-0.5", facing: 1}
      camera: {zoom: [1.0, 1.18], focus: [0.7, 0.5]}
      say: "Five people get on at Central. But there's a sixth. A man in a grey coat, in the last seat. You never saw him get on."
    - scene: inventory
      time: "12:40 AM"
      light: 100
      items:
        - {icon: key, count: 1, label: cab key, cue: key}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 2, label: batteries, cue: two}
      total: {text: "40 min to Harbor", cue: forty}
      say: "One cab key. One flashlight. Two spare batteries. Forty minutes to Harbor."
    - scene: tunnel
      time: "1:12 AM"
      place: PAST RIVERSIDE
      light: [100, 90]
      next: "NEXT: CANAL"
      signal: [[green, 0], [red, slowing]]
      stop: slowing
      station: {name: ASHGROVE, park: 1.4, flicker: true}
      say: "At one twelve, just past Riverside, the train starts slowing down. You never touched the brake."
    - scene: tunnel
      time: "1:13 AM"
      place: ASHGROVE
      light: 90
      parked: true
      next: "NEXT: ASHGROVE"
      station:
        name: ASHGROVE
        park: 1.4
        flicker: true
        people: [{dz: 1.2}, {dz: 3.0}, {dz: 4.6}, {dz: 6.5}]
      camera: {zoom: [1.0, 1.25], focus: [0.62, 0.45]}
      heartbeat: map
      say: "A platform slides out of the dark. The sign says Ashgrove. It's not on your map."
    - scene: train
      time: "1:13 AM"
      parked: true
      lights: flicker
      station:
        name: ASHGROVE
        flicker: true
        people:
          - {x: 0.05, facing: 1}
          - {x: 0.2, facing: 1}
          - {x: 0.8, facing: -1}
          - {x: 0.93, facing: -1}
      next: "NEXT: ASHGROVE"
      passengers:
        - {x: 0.06}
        - {x: 0.17, asleep: true}
        - {x: 0.28}
        - {x: 0.67}
        - {x: 0.78}
        - {x: 0.89, coat: true, facing: -1}
      you: {x: 0.5, action: scared, facing: 1}
      say: "People are waiting on the platform. Not moving. All of them facing your doors."
    - scene: choice
      time: "1:14 AM"
      base:
        scene: tunnel
        parked: true
        next: "DOORS: RELEASE?"
        station: {name: ASHGROVE, park: 1.4, flicker: true, people: [{dz: 1.2, stare: true}, {dz: 3.0, stare: true}, {dz: 4.6}]}
      question: "Open the doors or drive past?"
      options:
        - {text: Open, cue: open}
        - {text: Drive past, cue: drive}
      say: "Then the door button lights up on its own. Do you open the doors... or drive past?"
    - scene: endcard
      time: "1:14 AM"
      hold: 1.6
      say: "Follow for night two."

