# MIDNIGHT REEL (6 parts). You are the night projectionist at the Rialto, a
# 90-year-old cinema, for a week of six midnight shows.
# Cast: you (projectionist), Vera (the old manager, in person), the audience
# (silent figures that fill the seats when the projector runs; no tickets sold).
# Core idea, said plainly: the audience comes for one thing, a good story.
# Reel seven has no label: it shows the Rialto live, and it shows you. Little
# clues every night: a clock, a night counter, captions under you on that reel.
# Twist: you are the story. Your week has a counter, rules and a choice at the
# end of every part, because someone is watching it on a small glowing screen.
- id: reel-1
  format: stickman
  series: MIDNIGHT REEL
  day: 1
  day_label: NIGHT
  meter_label: BULB
  place: THE RIALTO
  title: "I run the midnight film at an old cinema. Zero tickets sold. Every seat full 🎞️"
  tags: [stickman, animation, horror, cinema, midnightreel, story]
  shots:
    - scene: cinema
      time: "11:30 PM"
      light: 100
      audience: 0
      screen: "THE RIALTO"
      say: "You take a job nobody else wants. Night projectionist at the Rialto, a ninety-year-old cinema, for six midnight shows."
    - scene: room
      time: "11:35 PM"
      place: PROJECTION BOOTH
      light: 100
      wall: "#3a3030"
      furniture: false
      desk: true
      clock: true
      window_view: cinema
      people: [{x: 0.7, action: idle, facing: -1, color: "#e0b070", cue: vera}]
      you: {x: 0.35, action: idle, facing: 1}
      say: "The manager, Vera, shows you the booth. Then she gives you her rules. Very seriously."
    - scene: title
      say: "Midnight reel. Night one."
    - scene: room
      time: "11:40 PM"
      light: 100
      wall: "#3a3030"
      furniture: false
      desk: true
      clock: true
      window_view: cinema
      people: [{x: 0.7, action: idle, facing: -1, color: "#e0b070"}]
      rule: {n: 1, text: Play the reels in order}
      you: {x: 0.35, action: idle, facing: 1}
      say: "Rule number one. Play the reels in order, one to six. Never play a reel without a label."
    - scene: room
      time: "11:42 PM"
      light: 100
      wall: "#3a3030"
      furniture: false
      desk: true
      clock: true
      window_view: cinema
      people: [{x: 0.7, action: idle, facing: -1, color: "#e0b070"}]
      rule: {n: 2, text: Never watch the audience}
      you: {x: 0.35, action: idle, facing: 1}
      say: "Rule number two. While the film is running, watch the screen. Never look at the audience."
    - scene: inventory
      time: "11:45 PM"
      light: 100
      items:
        - {icon: key, count: 1, label: booth key, cue: key}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: can, count: 6, label: film reels, cue: six}
      total: {text: "0 tickets sold", cue: zero}
      say: "One booth key. One flashlight. Six reels of film. And zero tickets sold for tonight."
    - scene: cinema
      time: "12:00 AM"
      light: 98
      audience: 0
      screen: "REEL 1"
      say: "At midnight, you start reel one. The hall is completely empty."
    - scene: cctv
      time: "12:30 AM"
      cam: "CAM 02 · HALL"
      light: 96
      src_y: 700
      view: {scene: cinema, audience: 0.9, screen: "REEL 1"}
      heartbeat: full
      say: "At twelve thirty, you check the hall camera. Every seat is full. Nobody came in."
    - scene: room
      time: "2:00 AM"
      light: 92
      wall: "#3a3030"
      furniture: false
      desk: true
      clock: true
      window_view: cinema
      you: {x: 0.4, action: idle, facing: 1}
      camera: {zoom: [1.0, 1.25], focus: [0.4, 0.55]}
      say: "When the film ends, the seats are empty again. And on your desk, there's a reel you've never seen. No label."
    - scene: choice
      time: "2:01 AM"
      base:
        scene: room
        wall: "#3a3030"
        furniture: false
        desk: true
        clock: true
        window_view: cinema
        you: {x: 0.4, action: idle, facing: 1}
      question: "Play it or lock it away?"
      options:
        - {text: Play it, cue: play}
        - {text: Lock it away, cue: lock}
      say: "Do you play it... or lock it away?"
    - scene: endcard
      time: "2:01 AM"
      hold: 1.6
      say: "Follow for night two."

