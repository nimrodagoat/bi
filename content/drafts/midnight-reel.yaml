      light: [90, 40]
      audience: 0.9
      flicker: true
      screen: "REEL 5"
      say: "Tonight's goal: get to the end of reel six. But at two AM, the projector bulb starts to flicker."
    - scene: choice
      time: "2:01 AM"
      base: {scene: cinema, audience: 0.9, flicker: true, screen: "REEL 5"}
      question: "Change the bulb or keep it running?"
      options:
        - {text: Change it, cue: change}
        - {text: Keep it running, cue: keep}
      say: "Changing it means one minute of darkness. Do you change the bulb... or keep it running?"
    - scene: endcard
      time: "2:01 AM"
      hold: 1.6
      say: "Follow for night three."

- id: reel-3
  format: stickman
  series: MIDNIGHT REEL
  day: 3
  day_label: NIGHT
  meter_label: BULB
  place: THE RIALTO
  title: "I broke the rule and looked at the audience. Night 3 🎞️"
  tags: [stickman, animation, horror, cinema, midnightreel, story]
  shots:
    - scene: cinema
      recap: true
      time: "2:01 AM"
      light: 40
      audience: 0.9
      flicker: true
      screen: "REEL 5"
      say: "Last night, the projector bulb started to die in the middle of the show."
    - scene: title
      say: "Midnight reel. Night three."
    - scene: cinema
      time: "2:02 AM"
      light: [40, 20]
      audience: 0.9
      flicker: true
      screen: "REEL 6"
      say: "You keep it running. It flickers until dawn, but it never goes dark. And the audience never moves."
    - scene: room
      time: "9:00 AM"
      place: PROJECTION BOOTH
      light: 100
      wall: "#3a3030"
      furniture: false
      desk: true
      clock: true
      window_view: cinema
      people: [{x: 0.7, action: idle, facing: -1, color: "#e0b070"}]
      you: {x: 0.35, action: idle, facing: 1}
      say: "In the morning, Vera explains. The audience has come since the cinema opened. Nobody knows who they are. They only come when a film is playing, and they only want one thing. A good story."
    - scene: room
      time: "11:50 PM"
      light: 100
      wall: "#3a3030"
      furniture: false
      desk: true
      clock: true
      window_view: cinema
      you: {x: 0.4, action: idle, facing: 1}
      say: "Tonight's goal: keep reel seven out of the projector."
