      question: "Look away or wave?"
      options:
        - {text: Look away, cue: look}
        - {text: Wave, cue: wave}
      say: "Do you look away... or wave back?"
    - scene: endcard
      time: "1:01 AM"
      hold: 1.6
      say: "Follow for night four."

