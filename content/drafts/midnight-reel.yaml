      time: "12:00 AM"
      place: THE RIALTO
      light: 100
      audience: 0.9
      screen: [["LIVE: THE BOOTH", 0], ["12:00 AM", clock]]
      screen_size: 110
      say: "But at midnight, reel seven is back. And in the corner of the picture, there's a little clock. It shows the exact time in your booth."
    - scene: cinema
      time: "1:00 AM"
      light: 100
      audience: 0.9
      turn: turns
      screen: "LIVE: THE BOOTH"
      screen_size: 90
      heartbeat: turns
      say: "At one AM, you break rule two. You look down at the audience. And every head in the hall turns around... and looks up at your window."
    - scene: choice
