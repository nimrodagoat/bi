# NIGHT BELL (6 parts). You are the night caretaker at Holloway High, an old
# school, ten PM to six AM.
# Cast: you (night caretaker), Ron (the retired caretaker, only on the radio),
# Mr. Crane (the Hall Monitor: a tall, silent figure in an old prefect's sash
# who walks the corridors whenever the night bell rings), and whatever is
# sealed in Room 12.
# The idea, said plainly: when the night bell rings, the thing in Room 12 can
# slip out into the corridors. It chases anything that runs. Crane makes
# everyone get into a room and lets pass-holders be. The brass hall pass is
# also the seal on Room 12's door.
# Twist: Crane was never hunting you; he was guarding you. After you re-seal
# Room 12 together, he puts his sash on you. And Ron admits he was the boy
# Crane saved in 1979; he became the caretaker to help him. Now it's you.
- id: night-bell-1
  format: stickman
  series: NIGHT BELL
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: HOLLOWAY HIGH
  title: "I'm the night caretaker at an old school. At 1 AM the school bell rang by itself 🔔"
  tags: [stickman, animation, horror, story, school, nightbell]
  shots:
    - scene: hallway
      time: "10:00 PM"
      light: 100
      lights: "on"
      wall: "#7a6a4a"
      floor: "#3a3a3a"
      carpet: "#55554f"
      ceiling: "#2a2620"
      exit_color: "#27d466"
      say: "You take the night caretaker job at Holloway High, an old school. Ten PM to six AM. Mop the corridors, check the doors, and keep the boiler running."
    - scene: radio
      time: "10:05 PM"
      on: radio
      chip: {text: "Ron · retired caretaker", cue: ron, y: 470}
      radio_label: "RADIO · RON"
      say:
        - "Ron, the old caretaker, gives you the rules on the radio."
        - radio: "Three rules, son. When the night bell rings, get into a room. Never run in the corridors. And always carry the brass hall pass."
    - scene: title
      say: "Night Bell. Night one."
    - scene: hallway
      time: "10:20 PM"
      light: 99
      lights: "on"
      wall: "#7a6a4a"
      floor: "#3a3a3a"
      carpet: "#55554f"
      ceiling: "#2a2620"
      exit_color: "#27d466"
      rule: {n: 1, text: When the bell rings get into a room}
      say: "Rule number one. If the school bell rings at night, get into the nearest room within ten seconds. And stay there until it rings again."
    - scene: hallway
      time: "10:30 PM"
      light: 98
      lights: "on"
      wall: "#7a6a4a"
      floor: "#3a3a3a"
      carpet: "#55554f"
      ceiling: "#2a2620"
      exit_color: "#27d466"
      rule: {n: 2, text: Never run in the corridors}
      say: "Rule number two. Never run in the corridors. Walk. Even if something tells you to run."
    - scene: inventory
      time: "10:40 PM"
      light: 97
      items:
        - {icon: key, count: 30, label: classroom keys, cue: keys}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: key, count: 1, label: brass hall pass, cue: pass}
      total: {text: "Always wear the pass", cue: three}
      rule: {n: 3, text: Always carry the hall pass}
      say: "Thirty classroom keys. One flashlight. And rule number three, an old brass hall pass, on a string. Never take it off."
    - scene: room
      time: "1:00 AM"
      place: ROOM 4
      light: 90
      wall: "#7d8a6a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.4, action: push, facing: 1}
      sfx: [{name: tick, at: bell}, {name: boom, at: slam}]
      heartbeat: bell
      say: "At one AM, the school bell rings. All by itself. You count. Seven. Eight. You slam yourself into Room four, just in time."
    - scene: room
      time: "1:02 AM"
      light: 89
      wall: "#7d8a6a"
      furniture: false
      desk: true
      clock: true
      dark: 0.4
      you: {x: 0.3, action: scared, facing: 1}
      people: [{x: 0.85, action: walk, facing: -1, color: "#9aa0a6", drift: -60, stare: true, cue: tall}]
      say: "Through the glass in the door, a tall, thin figure walks past. Slowly. An old prefect's sash across his chest. He's checking every door."
    - scene: choice
      time: "1:03 AM"
      base: {scene: room, wall: "#7d8a6a", furniture: false, desk: true, clock: true, dark: 0.4}
      question: "Stay hidden or peek out?"
      options:
        - {text: Stay hidden, cue: hidden}
        - {text: Peek out, cue: peek}
      say: "Do you stay hidden... or peek out?"
    - scene: endcard
      time: "1:03 AM"
      hold: 1.6
      say: "Follow for night two."

