# LOOKOUT (6 parts). You watch the forest for fires from a tower on Cedar
# Ridge, 120 steps up, from sunset to sunrise.
# Cast: you (new lookout), Hank (ranger, on the radio), the voice from the
# closed Pine Ridge tower (on a dead channel).
# Core idea, said plainly: blue lights in the forest are not fires. They go to
# whatever place someone names on the radio. The old Pine Ridge lookout sent
# them to you. Twist: you send them back to Pine Ridge, the same night Hank's
# new lookout starts there; now the new one hears the whisper.
# Map grid: columns A-D, rows 1-5. Cedar Ridge = C4, Pine Ridge = A1, station = D5.
- id: lookout-1
  format: stickman
  series: LOOKOUT
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: CEDAR RIDGE
  title: "I watch a forest for fires from a tower. Last night I saw blue lights 🌲"
  tags: [stickman, animation, horror, forest, lookout, story]
  shots:
    - scene: room
      time: "8:00 PM"
      light: 100
      wall: "#6e5236"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      you: {x: 0.3, action: idle, facing: 1}
      say: "You take a summer job nobody else wants. Lookout in a fire tower on Cedar Ridge, a hundred and twenty steps above the forest."
    - scene: radio
      time: "8:05 PM"
      on: radio
      chip: {text: "Hank · ranger station", cue: hank, y: 470}
      radio_label: "RANGER RADIO · HANK"
      say:
        - "Your only contact is Hank, the ranger, on the radio."
        - radio: "Welcome up, kid. Your job is simple. Watch the forest. Report every fire."
    - scene: title
      say: "Lookout. Night one."
    - scene: map
      time: "8:10 PM"
      route: [[0.625, 0.7], [0.625, 0.7]]
      route_cue: 0
      stops:
        - {x: 0.625, y: 0.7, left: true, label: "Cedar Ridge · C4"}
        - {x: 0.125, y: 0.1, label: "Pine Ridge · A1"}
        - {x: 0.875, y: 0.9, left: true, label: "Station · D5"}
      rule: {n: 1, text: Report every fire by square}
      say: "Rule number one. The forest is a grid of squares. If you see an orange glow, report its square on the radio."
    - scene: room
      time: "8:15 PM"
      light: 100
      wall: "#6e5236"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      rule: {n: 2, text: Never go down at night}
      you: {x: 0.75, action: idle, facing: 1}
      say: "Rule number two. Never go down the stairs before sunrise. Not for anything."
    - scene: inventory
      time: "8:20 PM"
      light: 100
      items:
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 4, label: batteries, cue: four}
        - {icon: can, count: 6, label: beans, cue: six}
      total: {text: "10 hours to sunrise", cue: ten}
      say: "One flashlight. Four batteries. Six cans of beans. Ten hours until sunrise."
    - scene: room
      time: "1:00 AM"
      light: 95
      wall: "#6e5236"
      furniture: false
      desk: true
      clock: true
      dark: 0.5
      window_view: forest
      window_lights: [{x: 0.12, y: 0.66, color: "#4fb3ff", n: 3, cue: lights, drift: 4}]
      you: {x: 0.3, action: idle, facing: 1}
      camera: {zoom: [1.0, 1.25], focus: [0.5, 0.42]}
      say: "At one AM, you see lights. Far away, near the old Pine Ridge tower. Not orange. Blue."
    - scene: map
      time: "1:02 AM"
      route: [[0.625, 0.7], [0.625, 0.7]]
      route_cue: 0
      stops:
        - {x: 0.625, y: 0.7, left: true, label: "Cedar Ridge · C4"}
        - {x: 0.125, y: 0.1, label: "Pine Ridge · A1"}
      danger: [{x: 0.15, y: 0.16, r: 0.07, n: 7, cue: move, color: "#4fb3ff"}]
      say: "They don't flicker like fire. They move, slowly, between the trees."
    - scene: radio
      time: "3:00 AM"
      on: crackles
      radio_label: "DEAD CHANNEL"
      say:
        - "At three AM, your radio crackles, on a channel nobody uses. A whisper."
        - radio: "Cedar Ridge."
    - scene: room
      time: "3:01 AM"
      light: 90
      wall: "#6e5236"
      furniture: false
      desk: true
      clock: true
      dark: 0.55
      window_view: forest
      window_lights: [{x: 0.12, y: 0.66, color: "#4fb3ff", n: 3}]
      you: {x: 0.3, action: scared, facing: 1}
      heartbeat: stop
      say: "And far away, the blue lights stop moving. All at once. As if they heard it too."
    - scene: choice
      time: "3:02 AM"
      base:
        scene: room
        wall: "#6e5236"
        furniture: false
        desk: true
        clock: true
        dark: 0.55
        window_view: forest
        window_lights: [{x: 0.12, y: 0.66, color: "#4fb3ff", n: 3}]
        you: {x: 0.3, action: scared, facing: 1}
      question: "Report them or stay silent?"
      options:
        - {text: Report them, cue: report}
        - {text: Stay silent, cue: silent}
      say: "Do you report the lights to Hank... or stay silent?"
    - scene: endcard
      time: "3:02 AM"
      hold: 1.6
      say: "Follow for night two."

