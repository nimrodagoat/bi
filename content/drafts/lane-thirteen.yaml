# LANE THIRTEEN (6 parts). You are the night closer at Starlite Bowl, an old
# bowling alley, eleven PM to five AM.
# Cast: you (night closer), Dot (the owner, only on the phone), and the bowler
# on Lane 13: a pale figure in an old league shirt, Lenny Vance.
# The idea, said plainly: in 1979 Lenny was one strike from a perfect game
# (300) on Lane 13 when he collapsed and died. Every night at three the lane
# switches on and he tries to finish, but a game needs two players. Dot says if
# he beats you, he keeps you in the game forever.
# Twist: you play him (as "GUEST", so your name is never on a scorecard) and
# roll your last ball into the gutter on purpose, so he gets his 300. Winning
# was never what he wanted; finishing was. He goes. Sting: the scoreboard
# flickers on by itself: NEXT GAME: GUEST vs DOT, 1979. Dot was his opponent
# that night, and she walked away before the last frame.
- id: lane-thirteen-1
  format: stickman
  series: LANE THIRTEEN
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: STARLITE BOWL
  title: "I'm the night closer at a bowling alley. At 3 AM the closed lane switched on 🎳"
  tags: [stickman, animation, horror, story, bowling, lane13]
  shots:
    - scene: room
      time: "11:00 PM"
      light: 100
      wall: "#5a3a5e"
      furniture: false
      desk: true
      monitors: true
      clock: true
      window: false
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night closing job at Starlite Bowl, an old bowling alley. Eleven PM to five AM. Oil the lanes and lock up."
    - scene: radio
      time: "11:05 PM"
      on: phone
      chip: {text: "Dot · owner", cue: dot, y: 470}
      radio_label: "PHONE · DOT"
      say:
        - "Dot, the owner, phones with the rules."
        - radio: "Three rules, hon. Lane thirteen is closed. Never switch it on. If its pins fall by themselves, don't reset them. And never write your name on a scorecard."
    - scene: title
      say: "Lane Thirteen. Night one."
    - scene: hallway
      time: "11:20 PM"
      place: THE LANES
      light: 99
      lights: "on"
      wall: "#3e2a44"
      floor: "#b07a42"
      carpet: "#c8925a"
      ceiling: "#1e1422"
      exit_color: "#f2f2f2"
      rule: {n: 1, text: Never switch on Lane 13}
      say: "Rule number one. Lane thirteen, at the very end, has been closed for years. Never switch it on."
    - scene: hallway
      time: "11:30 PM"
      light: 98
      lights: "on"
      wall: "#3e2a44"
      floor: "#b07a42"
      carpet: "#c8925a"
      ceiling: "#1e1422"
      exit_color: "#f2f2f2"
      rule: {n: 2, text: "If 13's pins fall, don't reset them"}
      say: "Rule number two. If the pins on thirteen ever fall by themselves, leave them. Don't reset them."
    - scene: inventory
      time: "11:40 PM"
      light: 97
      items:
        - {icon: bottle, count: 4, label: lane oil, cue: oil}
        - {icon: key, count: 12, label: lane keys, cue: keys}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
      total: {text: "Never sign a scorecard", cue: three}
      rule: {n: 3, text: Never write your name on a scorecard}
      say: "Four cans of lane oil. Twelve lane keys. No key for thirteen. And rule three. Never write your name on a scorecard. Tonight's goal: get everything locked up by five."
    - scene: hallway
      time: "3:00 AM"
      light: 85
      lights: flicker
      dark: 0.5
      wall: "#3e2a44"
      floor: "#b07a42"
      carpet: "#c8925a"
      ceiling: "#1e1422"
      exit_color: "#f2f2f2"
      sfx: [{name: whoosh, at: rolls, gain: 0.5}, {name: boom, at: strike}]
      heartbeat: strike
      say: "At three AM, with no key, Lane thirteen switches on by itself. You hear a ball roll down the wood, slow and heavy. And then. Strike."
    - scene: room
      time: "3:01 AM"
      place: FRONT COUNTER
      light: 84
      wall: "#5a3a5e"
      furniture: false
      desk: true
      monitors: true
      clock: true
      window: false
      dark: 0.4
      you: {x: 0.4, action: scared, facing: 1}
      chip: {text: "LANE 13 · PLAYER 1: ? · FRAME 1: X", cue: board, y: 520}
      say: "On the scoreboard above the counter, lane thirteen lights up. Player one. Just a question mark. Frame one. A strike."
    - scene: choice
      time: "3:02 AM"
      base: {scene: room, wall: "#5a3a5e", furniture: false, desk: true, monitors: true, clock: true, window: false, dark: 0.4}
      question: "Cut the power or keep watching?"
      options:
        - {text: Cut power, cue: cut}
        - {text: Watch, cue: watch}
      say: "Do you cut the power... or keep watching?"
    - scene: endcard
      time: "3:02 AM"
      hold: 1.6
      say: "Follow for night two."

