# HEADCOUNT (6 parts). You are the night keeper at Brackley City Zoo, ten PM to
# six AM. Your job: count every animal at midnight, three and six, and write
# the numbers on the board in the keeper's hut.
# Cast: you (night keeper), Mr. Osei (the head keeper, on the radio), and the
# Extra: every 3 AM count comes out one too many. One animal stands apart,
# very still, eyes shining. Each night it is a different animal, one enclosure
# closer to the hut.
# The idea, said plainly: Enclosure 9 has been "empty" since a 1987 storm blew
# its sign away. The old manager's rule: never count it and it'll go away. The
# Extra lives in 9; it copies other animals because it wants to be counted.
# Twist: you write "Enclosure 9: 1" on the board and it goes home. Next night
# the count for 9 is two. It was never trying to scare anyone: it needed
# someone to count it before its baby came.
- id: headcount-1
  format: stickman
  series: HEADCOUNT
  day: 1
  day_label: NIGHT
  meter_label: TORCH
  place: BRACKLEY ZOO
  title: "I'm the night keeper at a zoo. Every night my count comes out one too many 🦩"
  tags: [stickman, animation, horror, story, zoo, mystery]
  shots:
    - scene: room
      time: "10:00 PM"
      place: KEEPER'S HUT
      light: 100
      wall: "#55684a"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job at Brackley City Zoo. Ten PM to six AM. Your job is simple. Count every animal, and write the numbers on the board in the keeper's hut."
    - scene: radio
      time: "10:05 PM"
      on: radio
      chip: {text: "Mr. Osei · head keeper", cue: osei, y: 470}
      radio_label: "RADIO · MR. OSEI"
      say:
        - "Mr. Osei, the head keeper, radios the rules."
        - radio: "Three rules. Count at midnight, three and six. If a count comes out one too many, never recount. Write it down and walk on. And never go into Enclosure Nine."
    - scene: title
      say: "Headcount. Night one."
    - scene: street
      time: "12:00 AM"
      place: THE ZOO PATH
      light: 99
      pace: walk
      speed: 200
      dark: 0.5
      you: {light: true}
      rule: {n: 1, text: "Count at 12, 3 and 6"}
      counter:
        - {text: "4", label: penguins, cue: four}
        - {text: "12", label: flamingos, cue: twelve}
        - {text: "2", label: camels, cue: two}
      say: "Rule number one. Count at midnight, three and six. Four penguins. Twelve flamingos. Two camels. Everything matches."
    - scene: map
      time: "12:30 AM"
      place: ZOO PLAN
      light: 98
      rule: {n: 3, text: Never enter Enclosure 9}
      route: [[0.5, 0.98], [0.5, 0.25]]
      route_cue: 0
      route_end: nine
      stops:
        - {x: 0.5, y: 0.8, label: "Hut", cue: hut}
        - {x: 0.5, y: 0.6, label: "Camels · Flamingos", cue: hut}
        - {x: 0.5, y: 0.4, label: "Penguins", cue: hut}
        - {x: 0.5, y: 0.25, label: "Enclosure 9 · empty since 1987", ghost: true, cue: nine}
      say: "Rule number three. Never go into Enclosure Nine, at the far end of the zoo. It's been empty since nineteen eighty seven."
    - scene: street
      time: "3:00 AM"
      place: THE ZOO PATH
      light: 94
      stop: 0
      dark: 0.65
      you: {light: true, facing: 1}
      people: [{x: 0.72, action: idle, facing: -1, color: "#2c2c30", stare: true, cue: apart}]
      rule: {n: 2, text: "One too many? Never recount"}
      counter:
        - {text: "5", label: penguins, cue: five}
      heartbeat: apart
      say: "Rule number two. At three AM, you count the penguins. Five. There should be four. One of them stands apart, too still, and its eyes shine in your torch. Tonight's goal: get to six."
    - scene: choice
      time: "3:01 AM"
      base: {scene: street, stop: 0, dark: 0.65, you: {light: true, facing: 1}, people: [{x: 0.72, action: idle, facing: -1, color: "#2c2c30", stare: true}]}
      question: "Write it down or recount?"
      options:
        - {text: Write it down, cue: write}
        - {text: Recount, cue: recount}
      say: "Do you write it down and walk on... or recount?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night two."

