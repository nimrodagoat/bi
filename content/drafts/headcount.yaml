      say: "Tonight's goal: keep the rules, and get to six. At three AM, the flamingos. Thirteen. There should be twelve. One of them doesn't stand on one leg. It stands perfectly still, and it's looking right at you. You write it down, and walk on."
    - scene: map
      time: "3:05 AM"
