# FUNLAND (6 parts). You are the night guard at Maple Hill Funland, a closed
# theme park, ten PM to six AM.
# Cast: you (night guard), Rudy (the cheerful manager, on the radio), the girl in
# the yellow raincoat (rides the carousel alone at midnight), Barnaby (the bear
# mascot costume).
# Twist, twice: it was all a tryout. Rudy's crew staged everything to find a new
# head of the Halloween scare team, and you passed. But none of them played
# the girl on the carousel.
- id: funland-1
  format: stickman
  series: FUNLAND
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: MAPLE HILL FUNLAND
  title: "I'm the night guard at a closed theme park. At midnight the carousel started 🎠"
  tags: [stickman, animation, horror, themepark, funland, story]
  shots:
    - scene: street
      time: "10:00 PM"
      light: 100
      pace: walk
      dark: 0.65
      you: {light: true}
      say: "You take the night guard job at Maple Hill Funland. A theme park, closed for the winter. Just you, and the rides."
    - scene: radio
      time: "10:05 PM"
      on: radio
      chip: {text: "Rudy · park manager", cue: rudy, y: 470}
      radio_label: "RADIO · RUDY"
      say:
        - "The manager, Rudy, gives you the rules on the radio. He sounds way too cheerful."
        - radio: "Easy job, pal! Two rules. Never turn on a ride. And lock the carousel by midnight."
    - scene: title
      say: "Funland. Night one."
    - scene: carousel
      time: "10:30 PM"
      place: CAROUSEL
      light: 100
      bulbs: "off"
      dark: 0.6
      rule: {n: 1, text: Never turn on a ride}
      you: {x: 0.5, light: true, aim: 0.2, facing: 1}
      say: "Rule number one. Never turn on a ride. Not even to test it. Not even if you hear music."
    - scene: carousel
      time: "11:00 PM"
      light: 98
      bulbs: "off"
      dark: 0.6
      rule: {n: 2, text: Lock the carousel by midnight}
      sfx: [{name: click, at: lock}]
      you: {x: 0.5, light: true, aim: 0.2, facing: 1}
      say: "Rule number two. Lock the carousel by midnight. So at eleven, you lock it. Twice."
    - scene: inventory
      time: "11:10 PM"
      light: 96
      items:
        - {icon: key, count: 9, label: ride keys, cue: nine}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 3, label: batteries, cue: three}
      total: {text: "Gates open at 6 AM", cue: six}
      say: "Nine ride keys. One flashlight. Three batteries. The gates open at six AM."
    - scene: cctv
      time: "12:00 AM"
      cam: "CAM 02 · CAROUSEL"
      place: SECURITY BOOTH
      light: 95
      view: {scene: carousel, spin: 0.5, bulbs: "on", rider: {color: "#ffd34d", horse: 0, cue: girl}}
      sfx: [{name: tick, at: music}]
      heartbeat: girl
      say: "At midnight, music. On the camera, the carousel is spinning. Lights on. And riding it, all alone, is a little girl in a yellow raincoat."
    - scene: choice
      time: "12:01 AM"
      base: {scene: cctv, cam: "CAM 02 · CAROUSEL", view: {scene: carousel, spinning: true, bulbs: "on", rider: {color: "#ffd34d", horse: 0}}}
      question: "Check it out or call Rudy?"
      options:
        - {text: Check it out, cue: check}
        - {text: Call Rudy, cue: call}
      say: "Do you go check it out... or call Rudy?"
    - scene: endcard
      time: "12:01 AM"
      hold: 1.6
      say: "Follow for night two."

- id: funland-2
  format: stickman
  series: FUNLAND
  day: 2
  day_label: NIGHT
  meter_label: BATTERY
  place: SECURITY BOOTH
  title: "The girl on the carousel left her raincoat behind. Night 2 🎠"
  tags: [stickman, animation, horror, themepark, funland, story]
  shots:
    - scene: cctv
      recap: true
      time: "12:01 AM"
      cam: "CAM 02 · CAROUSEL"
      light: 95
      view: {scene: carousel, spinning: true, bulbs: "on", rider: {color: "#ffd34d", horse: 0}}
      say: "Last night, the locked carousel started spinning, with a little girl riding it alone."
    - scene: title
      say: "Funland. Night two."
    - scene: radio
      time: "12:02 AM"
      on: radio
      chip: {text: "Rudy · park manager", cue: 0, y: 470}
      radio_label: "RADIO · RUDY"
      say:
        - "You call Rudy. He laughs. A little too loud."
        - radio: "Old wiring, pal! Nobody's there. Go lock it again."
    - scene: carousel
      time: "12:10 AM"
      place: CAROUSEL
      light: 92
      spinning: true
      stop: stops
      bulbs: [["on", 0], ["off", stops]]
      dark: 0.55
      rider: {color: "#ffd34d", horse: 0, empty: true}
      you: {x: 0.5, light: true, aim: 0.25, facing: 1}
      heartbeat: raincoat
      say: "You go and check. The walk takes five long minutes. When you get there, the music stops. The carousel slows down. On the first horse, there's only a small yellow raincoat. Still wet. And the gate is still locked."
    - scene: room
      time: "12:20 AM"
      place: SECURITY BOOTH
      light: 90
      wall: "#4f5a60"
      furniture: false
      desk: true
      monitors: true
      clock: true
      rule: {n: 3, text: Stay out of the Ghost Train}
      you: {x: 0.42, action: idle, facing: 1}
      say: "Rudy adds rule number three, fast. Stay out of the Ghost Train. Whatever you hear inside."
    - scene: room
      time: "12:25 AM"
      light: 90
      wall: "#4f5a60"
      furniture: false
      desk: true
      monitors: true
      clock: true
      you: {x: 0.42, action: idle, facing: -1}
      say: "Tonight's goal: stay in the booth, and keep every ride switched off until six. Watch the cameras. Don't go out."
    - scene: cctv
      time: "2:00 AM"
      cam: "CAM 05 · GHOST TRAIN"
      light: 85
      view: {scene: hallway, lights: flicker, dark: 0.7, wall: "#3a2a4a", floor: "#1e1a24", carpet: "#4a2a5a", ceiling: "#1a1420", exit_color: "#ff3b30", figures: [{who: person, z: 7, to_z: 9, x: 0, facing: 1, action: walk, color: "#ffd34d", cue: yellow}]}
      say: "At two, the Ghost Train lights flicker on by themselves. And something small in yellow walks into the tunnel."
    - scene: choice
      time: "2:01 AM"
      base: {scene: cctv, cam: "CAM 05 · GHOST TRAIN", view: {scene: hallway, lights: flicker, dark: 0.7, wall: "#3a2a4a", floor: "#1e1a24", carpet: "#4a2a5a", ceiling: "#1a1420", exit_color: "#ff3b30"}}
      question: "Follow her or stay out?"
      options:
        - {text: Follow her, cue: follow}
        - {text: Stay out, cue: stay}
      say: "Rule three says stay out. Do you follow her in... or stay out?"
    - scene: endcard
      time: "2:01 AM"
      hold: 1.6
      say: "Follow for night three."

- id: funland-3
  format: stickman
  series: FUNLAND
  day: 3
  day_label: NIGHT
  meter_label: BATTERY
  place: GHOST TRAIN
  title: "I followed the girl into the Ghost Train. One mascot suit was missing. Night 3 🎠"
  tags: [stickman, animation, horror, themepark, funland, story]
  shots:
    - scene: cctv
      recap: true
      time: "2:01 AM"
      cam: "CAM 05 · GHOST TRAIN"
      light: 85
      view: {scene: hallway, lights: flicker, dark: 0.7, wall: "#3a2a4a", floor: "#1e1a24", carpet: "#4a2a5a", ceiling: "#1a1420", exit_color: "#ff3b30"}
      say: "Last night, a small figure in yellow walked into the Ghost Train."
    - scene: title
      say: "Funland. Night three."
    - scene: hallway
      time: "2:05 AM"
      light: 80
      lights: "off"
      dark: 0.85
      wall: "#3a2a4a"
      floor: "#1e1a24"
      carpet: "#4a2a5a"
      ceiling: "#1a1420"
      exit_color: "#ff3b30"
      figures: [{who: mannequin, z: 3.0, x: -0.6, facing: 1}, {who: mannequin, z: 5.0, x: 0.6, facing: -1}, {who: creature, z: 7.5, x: 0, cue: end}]
      rolling: {from: 1.3, to: 3.8}
      say: "You follow her in. It smells like old popcorn and wet paint. Plastic skeletons. Fake cobwebs. Your flashlight slips and rolls away. At the end of the tunnel, something is breathing. Slowly. And it isn't a prop."
    - scene: room
      time: "2:10 AM"
      place: COSTUME ROOM
      light: 78
      wall: "#5a4a3a"
      furniture: false
      window: false
      dark: 0.5
      people:
        - {x: 0.3, action: idle, facing: 1, color: "#8a5a3a", mascot: "#8a5a3a"}
        - {x: 0.5, action: idle, facing: 1, color: "#c98a3a", mascot: "#c98a3a"}
      you: {x: 0.75, light: true, aim: 0.0, facing: -1}
      say: "It leads to the costume room. Three hooks for the three mascot suits. Barnaby the bear's hook is empty. The other two bears just stare at you."
    - scene: room
      time: "2:11 AM"
      light: 78
      wall: "#5a4a3a"
      furniture: false
      window: false
      dark: 0.5
      rule: {n: 4, text: "If a suit is missing, hide"}
      people:
        - {x: 0.3, action: idle, facing: 1, color: "#8a5a3a", mascot: "#8a5a3a"}
        - {x: 0.5, action: idle, facing: 1, color: "#c98a3a", mascot: "#c98a3a"}
      you: {x: 0.75, light: true, aim: 0.0, facing: -1}
      say: "Taped to the wall, rule number four, in Rudy's handwriting. If a suit is missing, hide. Don't let it hug you. Whatever it says."
    - scene: room
      time: "2:12 AM"
      light: 76
      wall: "#5a4a3a"
      furniture: false
      window: false
      dark: 0.55
      door_open: [[0, 0], [0.8, door]]
      people:
        - {x: 0.3, action: idle, facing: 1, color: "#8a5a3a", mascot: "#8a5a3a"}
        - {x: 0.5, action: idle, facing: 1, color: "#c98a3a", mascot: "#c98a3a"}
        - {x: 0.92, action: idle, facing: -1, color: "#6b4226", mascot: "#6b4226", cue: door}
      sfx: [{name: click, at: door}]
      you: {x: 0.7, light: true, aim: 0.0, facing: 1, action_at: {door: scared}}
      heartbeat: door
      say: "Then the door creaks open. A giant bear head leans in. Barnaby. Waving."
    - scene: choice
      time: "2:13 AM"
      base:
        scene: room
        wall: "#5a4a3a"
        furniture: false
        window: false
        dark: 0.55
        door_open: 0.8
        people: [{x: 0.92, action: idle, facing: -1, color: "#6b4226", mascot: "#6b4226"}]
        you: {x: 0.7, light: true, aim: 0.0, facing: 1, action: scared}
      question: "Hide or run past it?"
      options:
        - {text: Hide, cue: hide}
        - {text: Run past, cue: run}
      say: "It hasn't seen you yet. Do you hide behind the suits... or run past it, back to the booth?"
    - scene: endcard
      time: "2:13 AM"
      hold: 1.6
      say: "Follow for night four."

