      time: "4:02 AM"
      hold: 1.6
      say: "Follow for night five."

- id: funland-5
  format: stickman
  series: FUNLAND
  day: 5
  day_label: NIGHT
  meter_label: BATTERY
  place: SECURITY BOOTH
  title: "I found a whiteboard in the park office. My name was on it. Night 5 🎠"
