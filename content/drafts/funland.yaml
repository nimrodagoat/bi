    - scene: closeup
      recap: true
      object: phone
      time: "4:02 AM"
      screen: Ticket
      sub: Maple Hill Funland
      message: "ADMIT ONE\nTHE LAST RIDE"
      message_cue: 0
      say: "Last night, the girl in the yellow raincoat gave you a ticket for the last ride."
    - scene: title
      say: "Funland. Night five."
    - scene: room
      time: "11:00 PM"
      place: PARK OFFICE
      light: 90
      wall: "#5c6a58"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.35, light: true, aim: 0.1, facing: 1}
      say: "You keep it. The next night, before your shift, you sneak into Rudy's office to look for answers. Behind his desk, you find a whiteboard."
    - scene: closeup
      object: phone
      time: "11:05 PM"
      screen: Whiteboard
      sub: "Rudy's office"
      message: "NEW GUARD\nCAROUSEL: PASSED\nGHOST TRAIN: PASSED\nBARNABY: PASSED"
      message_cue: passed
      heartbeat: passed
      say: "New guard. Carousel: passed. Ghost Train: passed. Barnaby: passed. Every night you survived, ticked off like a test."
    - scene: room
      time: "11:10 PM"
      light: 88
      wall: "#5c6a58"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.35, action: idle, facing: -1}
      say: "Underneath, one line is still empty. Final night: the last ride. And next to it, a little drawing of a carousel."
    - scene: inventory
      time: "11:15 PM"
      light: 85
      items:
        - {icon: battery, count: 1, label: battery, cue: battery}
        - {icon: key, count: 9, label: ride keys, cue: keys}
      total: {text: "1 night left", cue: night}
      say: "One battery. Nine keys. One night left. Your goal: find out who's been testing you all week, and why."
    - scene: radio
      time: "11:20 PM"
      on: radio
      chip: {text: "Rudy · park manager", cue: 0, y: 470}
      radio_label: "RADIO · RUDY"
      say:
        - "Then the radio crackles."
        - radio: "Big night tomorrow, pal. Don't forget your ticket."
    - scene: choice
      time: "11:21 PM"
      base: {scene: radio, on: 0}
      question: "Confront Rudy or play along?"
      options:
        - {text: Confront him, cue: confront}
        - {text: Play along, cue: play}
      say: "How does he know about the ticket? Do you confront Rudy tonight... or play along, and take the last ride?"
    - scene: endcard
      time: "11:21 PM"
      hold: 1.6
      say: "Follow for the last night."

- id: funland-6
  format: stickman
  series: FUNLAND
  day: 6
  day_label: NIGHT
  meter_label: BATTERY
  place: CAROUSEL
  title: "On my last night at the theme park, I took the last ride. Night 6 🎠"
  tags: [stickman, animation, horror, themepark, funland, story]
  shots:
    - scene: radio
      recap: true
      time: "11:21 PM"
      on: 0
      say: "Last night, you found out someone has been testing you all week."
    - scene: title
      say: "Funland. Night six."
    - scene: carousel
      time: "12:00 AM"
      light: 80
      bulbs: [["off", 0], ["on", lights]]
      spin: lights
      dark: 0.5
      you: {x: 0.5, light: true, aim: 0.2, facing: 1}
      say: "At midnight, you take your ticket to the carousel. The lights snap on. The music starts."
    - scene: carousel
      time: "12:01 AM"
      light: 80
      spinning: true
      bulbs: "on"
      dark: 0.2
      sfx: [{name: boom, at: floodlights}]
      say: "Then every floodlight in the park comes on at once. And people step out of the dark. Clapping."
    - scene: room
      time: "12:02 AM"
      place: CAROUSEL
      light: 100
      wall: "#7a2f3f"
      furniture: false
      window: false
      people:
        - {x: 0.55, action: knock, facing: -1, color: "#e0b070"}
        - {x: 0.7, action: idle, facing: -1, color: "#6b4226", mascot: "#6b4226"}
        - {x: 0.85, action: knock, facing: -1, color: "#c9b8e0"}
      you: {x: 0.3, action: scared, facing: 1}
      say: "It's Rudy. And the whole park crew. Barnaby is just Marco from the snack bar, in a costume."
    - scene: room
      time: "12:03 AM"
      light: 100
      wall: "#7a2f3f"
      furniture: false
      window: false
      people:
        - {x: 0.55, action: idle, facing: -1, color: "#e0b070"}
        - {x: 0.7, action: idle, facing: -1, color: "#6b4226", mascot: "#6b4226"}
        - {x: 0.85, action: idle, facing: -1, color: "#c9b8e0"}
      you: {x: 0.3, action: idle, facing: 1}
      say: "It was a tryout, Rudy says. For the new head of our Halloween scare crew. Nobody has ever made it to the last ride. You're hired."
    - scene: room
      time: "12:05 AM"
      light: 100
      wall: "#7a2f3f"
      furniture: false
      window: false
      people:
        - {x: 0.55, action: idle, facing: -1, color: "#e0b070"}
        - {x: 0.7, action: idle, facing: -1, color: "#6b4226", mascot: "#6b4226"}
        - {x: 0.85, action: idle, facing: -1, color: "#c9b8e0"}
      you: {x: 0.3, action: idle, facing: 1}
      say: "You laugh. Then you ask: and which of you played the little girl in the yellow raincoat? Rudy's smile slowly fades. What girl?"
    - scene: carousel
      time: "12:06 AM"
      light: 100
      spinning: true
      bulbs: flicker
      dark: 0.3
      rider: {color: "#ffd34d", horse: 0}
      heartbeat: 0
      say: "Behind you, the carousel music starts again. And on the first horse, someone small in yellow waves goodbye."
    - scene: choice
      time: "12:07 AM"
      base: {scene: carousel, spinning: true, bulbs: flicker, dark: 0.3, rider: {color: "#ffd34d", horse: 0}}
      question: "Take the job or run?"
      options:
        - {text: Take the job, cue: take}
        - {text: Run, cue: run}
      say: "So. Do you take the job... or run, and never come back?"
    - scene: endcard
      time: "12:07 AM"
      final: true
      hold: 1.8
      say: "Follow for a brand new story."
