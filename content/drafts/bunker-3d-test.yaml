# output/b3d), the usual engine adds the Andrew voice, one-word captions and sound.
- id: bunker-3d-test
  format: stickman
  style: explainer
  series: HOW IT WORKS
  day: 1
  title: "3D test: wizards build a bunker"
  tags: [howitworks, test]
  shots:
