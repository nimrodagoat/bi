# WARD C (6 parts). You are the night porter at Greyhill Hospital: trays,
# laundry, and the long corridor of Ward C, ten PM to six AM.
# Cast: you (night porter), Nurse June (night nurse at the desk), Mr. Ashby
# (the old patient in room 13, who always knows what happens next).
# Core idea, said plainly: at 3:33 the corridor lights die and the Night
# Visitor walks the ward, looking into every open door. Close every door.
# Clue every night: the calendar always says October 31; the same things happen.
# Twist: it's a time loop. Mr. Ashby's wristband has your name on it; he is
# you, after fifty years of this night. Last shot: the counter says NIGHT 1.
- id: ward-c-1
  format: stickman
  series: WARD C
  day: 1
  day_label: NIGHT
  meter_label: LIGHTS
  place: GREYHILL HOSPITAL
  title: "I work nights in an old hospital. The patient in room 13 knows what I'll do next 🏥"
  tags: [stickman, animation, horror, hospital, wardc, story]
  shots:
    - scene: hallway
      time: "10:00 PM"
      place: WARD C
      light: 100
      lights: "on"
      wall: "#a3b1af"
      floor: "#7d8b89"
      carpet: "#9fb0ad"
      ceiling: "#7f8b8a"
      exit_color: "#27d466"
      camera: {zoom: [1.0, 1.25], focus: [0.5, 0.45]}
      say: "You take the job nobody wants. Night porter at Greyhill Hospital. Trays, laundry, and the long corridor of Ward C."
    - scene: room
      time: "10:05 PM"
      place: NURSE STATION
      light: 100
      wall: "#8fa8a4"
      furniture: false
      desk: true
      monitors: true
      clock: true
      people: [{x: 0.72, action: idle, facing: -1, color: "#9ad0c8", cue: june}]
      you: {x: 0.35, action: idle, facing: 1}
      say: "The night nurse, June, has worked here for thirty years. She gives you two rules."
    - scene: title
      say: "Ward C. Night one."
    - scene: hallway
      time: "10:10 PM"
      place: WARD C
      light: 100
      lights: "on"
      open_doors: [0, 1, 2, 3, 4]
      wall: "#a3b1af"
      floor: "#7d8b89"
      carpet: "#9fb0ad"
      ceiling: "#7f8b8a"
      exit_color: "#27d466"
      rule: {n: 1, text: Close every door at 3:33}
      say: "Rule number one. At three thirty three, close every patient's door. Every single one."
    - scene: room
      time: "10:12 PM"
      place: NURSE STATION
      light: 100
      wall: "#8fa8a4"
      furniture: false
      desk: true
      monitors: true
      clock: true
      people: [{x: 0.72, action: idle, facing: -1, color: "#9ad0c8"}]
      rule: {n: 2, text: Never take the east lift}
      you: {x: 0.35, action: idle, facing: 1}
      say: "Rule number two. After midnight, never take the east lift. Use the stairs."
    - scene: room
      time: "11:00 PM"
      place: ROOM 13
      light: 98
      wall: "#a7b4b2"
      furniture: false
      door: true
      clock: true
      people: [{x: 0.66, action: idle, facing: -1, color: "#c9c3b8", cue: man}]
      you: {x: 0.3, action: idle, facing: 1}
      say: "Your first job: a tray for room thirteen. An old man, Mr. Ashby, looks up and smiles. You're going to drop that, he says."
    - scene: room
      time: "11:01 PM"
      light: 98
      wall: "#a7b4b2"
      furniture: false
      clock: true
      people: [{x: 0.66, action: idle, facing: -1, color: "#c9c3b8"}]
      sfx: [{name: hit, at: drop}]
      shake_at: [drop]
      you: {x: 0.3, action: idle, facing: 1, action_at: {drop: scared}}
      say: "One second later, you drop it. He doesn't even look surprised."
    - scene: hallway
      time: "3:33 AM"
      place: WARD C
      light: [95, 30]
      lights: dying
      "off": out
      dark: 0.8
      open_doors: [0, 1, 2, 3, 4]
      wall: "#a3b1af"
      floor: "#7d8b89"
      carpet: "#9fb0ad"
      ceiling: "#7f8b8a"
      exit_color: "#27d466"
      figures: [{who: creature, z: 8.0, x: 0.0, cue: end, facing: -1}]
      heartbeat: end
      say: "At three thirty three, the corridor lights go out, one by one. And at the far end, something tall is standing."
    - scene: choice
      time: "3:34 AM"
      base:
        scene: hallway
        lights: "off"
        dark: 0.8
        open_doors: [0, 1, 2, 3, 4]
        wall: "#a3b1af"
        floor: "#7d8b89"
        carpet: "#9fb0ad"
        ceiling: "#7f8b8a"
        exit_color: "#27d466"
        figures: [{who: creature, z: 8.0, x: 0.0, facing: -1}]
