    - scene: title
      say: "Night Loaf. Night three."
    - scene: radio
      time: "6:05 AM"
      on: phone
      radio_label: "PHONE · MRS. HOLLINS"
      say:
        - "You tell Mrs. Hollins. She isn't cross. She just sighs."
        - radio: "That's the Neighbour, love. As long as it's fed, it keeps the village safe. Never miss a night. Not one."
    - scene: map
      time: "1:20 AM"
      place: ORDER BOOK 1902
      light: 100
      route: [[0.3, 0.98], [0.3, 0.3]]
