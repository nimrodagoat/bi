      creatures: [{x: 0.8, facing: -1, cue: tall, scale: 1.3}]
      heartbeat: tall
      say: "You break rule three, and look. On the step, crouched, is something very tall and very thin. It's wearing an old, floury baker's apron. It holds the loaf in both hands, like something precious."
    - scene: room
      time: "3:03 AM"
      light: 92
      wall: "#a8744a"
      furniture: false
      desk: true
      clock: true
      dark: 0.45
      you: {x: 0.35, action: scared, facing: 1}
      creatures: [{x: 0.8, facing: -1, scale: 1.3}]
      chip: {text: "One penny · 1902", cue: penny, y: 520}
      say: "It sees you. It doesn't run. It just puts something on the step, and walks away into the dark. A single old penny. Dated nineteen oh two. It's warm, as if it's been held for a long time."
    - scene: room
      time: "5:30 AM"
      light: [80, 40]
      wall: "#a8744a"
      furniture: false
      desk: true
      clock: true
      dark: 0.3
      you: {x: 0.55, action: push, facing: 1}
      say: "Tonight's goal: still sixty loaves by six. But the oven is cooling, too fast. You light it again and again. Your arms ache. You finish the last loaf at one minute to six."
    - scene: choice
      time: "6:00 AM"
      base: {scene: room, wall: "#a8744a", furniture: false, desk: true, clock: true, dark: 0.3}
      question: "Tell Mrs. Hollins or keep it quiet?"
      options:
        - {text: Tell her, cue: tell}
        - {text: Keep quiet, cue: quiet}
      say: "Do you tell Mrs. Hollins what you saw... or keep it quiet?"
    - scene: endcard
      time: "6:00 AM"
      hold: 1.6
      say: "Follow for night three."

- id: night-loaf-3
  format: stickman
  series: NIGHT LOAF
  day: 3
  day_label: NIGHT
  meter_label: OVEN
  place: HOLLINS BAKERY
  title: "The old baker said the thing on the step keeps the village safe. From what? 🍞"
  tags: [stickman, animation, horror, story, bakery, village]
  shots:
    - scene: room
