# NIGHT LOAF (6 parts). You are the night baker at Hollins Bakery in the
# village of Upper Fenwick, one AM to six AM. The meter is the OVEN heat.
# Cast: you (night baker), Mrs. Hollins (the retired baker, only on the phone),
# and the Neighbour: something tall and thin in an old baker's apron that
# takes the extra loaf from the back step at three.
# The idea, said plainly: since the famine winter of 1902 the bakery has left
# one small dark loaf out every night, baked from a very old sourdough starter.
# Fed, the Neighbour stands at the edge of the woods all night, and the shapes
# in the trees keep away from the village.
# Twist: the Neighbour is old Joseph Hollins, the first baker, Mrs. Hollins's
# grandfather. In 1902 he made the deal: he guards the village, the bakery
# feeds him. When the starter dies you revive it, he finally speaks: "Tell
# Margaret her grandad says thank you."
- id: night-loaf-1
  format: stickman
  series: NIGHT LOAF
  day: 1
  day_label: NIGHT
  meter_label: OVEN
  place: HOLLINS BAKERY
  title: "I'm the night baker in a village. Every night I leave one loaf on the back step 🍞"
  tags: [stickman, animation, horror, story, bakery, village]
  shots:
    - scene: room
      time: "1:00 AM"
      light: 100
      wall: "#a8744a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.4, action: push, facing: 1}
      say: "You take the night baker job at Hollins Bakery, in the tiny village of Upper Fenwick. One AM to six AM. One old brick oven."
    - scene: radio
      time: "1:05 AM"
      on: phone
      chip: {text: "Mrs. Hollins · retired baker", cue: hollins, y: 470}
      radio_label: "PHONE · MRS. HOLLINS"
      say:
        - "Mrs. Hollins, the old baker, phones with the rules."
        - radio: "Three rules, love. Sixty loaves by six. One extra loaf, from the black tin, on the back step at three. And never look out of the back window while it's there."
    - scene: title
      say: "Night Loaf. Night one."
    - scene: room
      time: "1:20 AM"
      light: 99
      wall: "#a8744a"
      furniture: false
      desk: true
      clock: true
      rule: {n: 1, text: Sixty loaves by six}
      you: {x: 0.45, action: push, facing: 1}
      say: "Rule number one. Sixty loaves out of the oven by six. Tonight's goal: all sixty, on time."
    - scene: inventory
      time: "1:30 AM"
      light: 98
      items:
        - {icon: can, count: 6, label: flour tins, cue: flour}
        - {icon: matches, count: 1, label: oven matches, cue: matches}
        - {icon: key, count: 1, label: back door key, cue: key}
      total: {text: "One old black tin", cue: black}
      say: "Six tins of flour. One box of matches for the old oven. The back door key. And one heavy old black tin."
    - scene: room
      time: "2:45 AM"
      light: 96
      wall: "#a8744a"
      furniture: false
      desk: true
      clock: true
      rule: {n: 2, text: "Extra loaf on the back step at 3"}
      you: {x: 0.55, action: reach, facing: 1}
      chip: {text: "Jar: STARTER · 1902", cue: jar, y: 520}
      say: "Rule number two. The extra loaf. It's small and dark, made from a jar of sourdough on the top shelf. The label says nineteen oh two. At three, it goes on the back step."
    - scene: room
      time: "3:00 AM"
      light: 95
      wall: "#a8744a"
      furniture: false
      desk: true
      clock: true
      dark: 0.35
      rule: {n: 3, text: Never look out of the back window}
      you: {x: 0.35, action: listen, facing: 1}
      sfx: [{name: knock, at: chewing}]
      heartbeat: chewing
      say: "Rule number three. Never look out of the back window while the loaf is there. At three, you put it out. A minute later, from the step, you hear chewing. Slow. Careful."
    - scene: choice
      time: "3:01 AM"
      base: {scene: room, wall: "#a8744a", furniture: false, desk: true, clock: true, dark: 0.35}
      question: "Look out of the window or keep baking?"
      options:
        - {text: Look, cue: look}
        - {text: Keep baking, cue: baking}
      say: "Do you look out of the back window... or keep baking?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night two."

- id: night-loaf-2
  format: stickman
  series: NIGHT LOAF
  day: 2
  day_label: NIGHT
  meter_label: OVEN
  place: HOLLINS BAKERY
  title: "I looked out of the bakery's back window. Something tall was eating the loaf 🍞"
  tags: [stickman, animation, horror, story, bakery, village]
  shots:
