- id: night-loaf-6
  format: stickman
  series: NIGHT LOAF
  day: 6
  day_label: NIGHT
  meter_label: OVEN
  place: HOLLINS BAKERY
  title: "I finally found out who the Neighbour was. And who it had been protecting 🍞"
  tags: [stickman, animation, horror, story, bakery, village]
  shots:
    - scene: street
      recap: true
