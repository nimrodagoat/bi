        - {x: 0.3, y: 0.45, label: "Extra loaf: for the Neighbour", ghost: true, cue: neighbour}
      say: "The next night, tonight's goal: find out what it keeps us safe from. In the oldest order book, nineteen oh two. The famine winter. Baker, J. Hollins. At the bottom of every page, one extra loaf. For the Neighbour."
    - scene: street
      time: "3:10 AM"
      place: THE BACK LANE
      light: 94
      stop: 0
      dark: 0.75
      lurkers: 3
