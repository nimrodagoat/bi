      furniture: false
      desk: true
      clock: true
      monitors: true
      dark: 0.4
      you: {x: 0.6, action: reach, facing: 1}
      say: "Last night, the tape on Dryer thirteen peeled off by itself. And something inside knocked."
    - scene: title
      say: "Spin Cycle. Night three."
    - scene: room
