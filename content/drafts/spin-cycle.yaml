# SPIN CYCLE (6 parts). You are the night attendant at Suds 24, an all-night
# laundromat, ten PM to six AM.
# Cast: you (night attendant), Mrs. Okafor (the owner, only on the phone), the
# woman in green (one of the "night customers" who only appear on the security
# camera), and Dryer 13 (taped shut since 1986).
# The idea, said plainly: after three AM the camera shows the laundromat full of
# people folding washing, though the room is empty. They are trapped: Dryer 13
# never finished its last cycle in 1986, and nobody can leave until it does.
# Twist: you finish the cycle with an old 1986 token and the night customers go
# free. Then Mrs. Okafor arrives, furious: they did all the shop's service
# washes for free for forty years; she kept them trapped. Sting: "Someone will
# have to do the folding now." Behind you, Dryer 13 starts to spin.
- id: spin-cycle-1
  format: stickman
  series: SPIN CYCLE
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: SUDS 24
  title: "I'm the night attendant at a laundromat. At 3 AM the camera showed customers who weren't there 🧺"
  tags: [stickman, animation, horror, story, laundromat, spincycle]
  shots:
    - scene: room
      time: "10:00 PM"
      light: 100
      wall: "#9fb8c2"
      furniture: false
      desk: true
      clock: true
      monitors: true
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job at Suds twenty four, an all night laundromat. Ten PM to six AM. Fold the washes, empty the coin boxes, keep the machines running."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Mrs. Okafor · owner", cue: owner, y: 470}
      radio_label: "PHONE · MRS. OKAFOR"
      say:
        - "Mrs. Okafor, the owner, phones with the rules."
        - radio: "Three rules. Never open Dryer thirteen. If a machine starts on its own, let it finish. And after three, don't watch the camera."
    - scene: title
      say: "Spin Cycle. Night one."
    - scene: room
      time: "10:20 PM"
      light: 99
      wall: "#9fb8c2"
      furniture: false
      desk: true
      clock: true
      monitors: true
      rule: {n: 1, text: Never open Dryer 13}
      you: {x: 0.45, action: idle, facing: 1}
      say: "Rule number one. Dryer thirteen, in the corner, is taped shut with old brown tape. Never open it. Not even a crack."
    - scene: room
      time: "10:30 PM"
      light: 98
      wall: "#9fb8c2"
      furniture: false
      desk: true
      clock: true
      monitors: true
      rule: {n: 2, text: Never stop a machine that starts by itself}
      you: {x: 0.45, action: idle, facing: 1}
      say: "Rule number two. If a machine starts by itself, let it finish. Never stop a cycle halfway."
    - scene: inventory
      time: "10:40 PM"
      light: 97
      items:
        - {icon: bottle, count: 6, label: soap, cue: soap}
        - {icon: key, count: 3, label: coin box keys, cue: keys}
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
      total: {text: "12 washes by 6 AM", cue: twelve}
      say: "Six bottles of soap. Three coin box keys. One flashlight. Tonight's goal: fold all twelve service washes by six."
    - scene: room
      time: "3:00 AM"
      light: 85
      wall: "#9fb8c2"
      furniture: false
      desk: true
      clock: true
      monitors: true
      dark: 0.3
      rule: {n: 3, text: "After 3 AM, don't watch the camera"}
      you: {x: 0.4, action: scared, facing: 1}
      sfx: [{name: tick, at: start}, {name: tick, at: every}]
      heartbeat: every
      say: "Rule number three. After three AM, don't watch the camera. At exactly three, every machine in the shop starts by itself."
    - scene: cctv
      time: "3:02 AM"
      cam: "CAM 01 · SUDS 24"
      light: 84
      view: {scene: room, wall: "#9fb8c2", furniture: false, desk: true, clock: true, dark: 0.3, you: {x: -0.5}, people: [{x: 0.25, action: idle, facing: 1, color: "#b9c4c9"}, {x: 0.5, action: idle, facing: -1, color: "#b9c4c9"}, {x: 0.75, action: idle, facing: -1, color: "#5aa36b", stare: true, cue: green}]}
      glitch: empty
      say: "You glance at the camera. The laundromat is full of people, quietly folding. You look up. The room is empty. And on the screen, a woman in green turns, and looks straight at you."
    - scene: choice
      time: "3:03 AM"
      base: {scene: cctv, cam: "CAM 01 · SUDS 24", view: {scene: room, wall: "#9fb8c2", furniture: false, desk: true, clock: true, dark: 0.3, you: {x: -0.5}, people: [{x: 0.75, action: idle, facing: -1, color: "#5aa36b", stare: true}]}}
      question: "Switch it off or keep watching?"
      options:
        - {text: Switch off, cue: switch}
        - {text: Watch, cue: watching}
      say: "Do you switch the camera off... or keep watching?"
    - scene: endcard
      time: "3:03 AM"
      hold: 1.6
      say: "Follow for night two."

