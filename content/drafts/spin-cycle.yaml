      say: "The next night, tonight's goal: find out what's wrong with Dryer thirteen. In the old repair log, it broke down in March nineteen eighty six, in the middle of a cycle. The same night the attendant, Joe Pike, went missing. His last note says: thirteen won't stop. They can't leave."
