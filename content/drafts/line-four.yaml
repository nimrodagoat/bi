# LINE FOUR (6 parts). You host the overnight show at Radio 97.4, a tiny
# station on a hill above the town of Pine Hollow.
# Cast: you (night host), Gus (old engineer, only on the intercom from
# downstairs), the voice on line four (a calm caller).
# Core idea, said plainly: line four was cut off in 1979, the night host Danny
# Ross put it on air and vanished. The voice on it knows what happens next, and
# whatever it says on air comes true for the whole town. Goal: six shows, and
# never let it on air. Twist: Gus died in 1979; he's been helping all along.
