# NEW STAR (6 parts). You are the night assistant at Kelder Hill Observatory,
# nine PM to six AM.
# Cast: you (night assistant), Professor Adair (the retired astronomer, only on
# the radio from his cottage at the foot of the hill), and the light: a "new
# star" low over the hills that turns out to be a lantern carried by something
# very tall, one hill closer every night.
# The idea, said plainly: Adair says it came in 1976 and took his assistant,
# Ruth. Ruth's old note says it isn't here for you; it's here for him. In
# Adair's desk is a brass sky-chart with one star circled: home.
# Twist: the lantern-bearer was never the danger. It's a rescuer. Adair is the
# lost one: he came from up there and hid the chart so he'd never have to go
# back. You hand the chart over; by dawn there are two new stars, and
# Adair's cottage is empty.
- id: new-star-1
  format: stickman
  series: NEW STAR
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: KELDER HILL
  title: "I'm the night assistant at an observatory. A new star appeared below the horizon ⭐"
  tags: [stickman, animation, horror, story, observatory, stars]
  shots:
    - scene: room
      time: "9:00 PM"
      light: 100
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job at Kelder Hill Observatory. Nine PM to six AM. One big telescope, a dome that creaks in the wind, and a sky full of stars."
    - scene: radio
      time: "9:05 PM"
      on: radio
      chip: {text: "Professor Adair · retired astronomer", cue: adair, y: 470}
      radio_label: "RADIO · PROFESSOR ADAIR"
      say:
        - "Professor Adair, who ran this place for fifty years, radios from his cottage at the bottom of the hill."
        - radio: "Three rules. Log every star, every hour. Never point the telescope below the hills. And if a new star appears, tell nobody but me."
    - scene: title
      say: "New Star. Night one."
    - scene: room
      time: "9:20 PM"
      light: 99
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      rule: {n: 1, text: Log every star every hour}
      you: {x: 0.45, action: reach, facing: 1}
      say: "Rule number one. Every hour, you log every star you can see. Anything new goes in red."
    - scene: room
      time: "9:30 PM"
      light: 98
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      rule: {n: 2, text: Never point the telescope below the hills}
      you: {x: 0.45, action: idle, facing: 1}
      say: "Rule number two. Never point the telescope below the line of the hills. There are no stars down there. Tonight's goal: a clean log, every hour, until six."
    - scene: inventory
      time: "9:40 PM"
      light: 97
      items:
        - {icon: key, count: 2, label: dome keys, cue: keys}
        - {icon: flashlight, count: 1, label: red flashlight, cue: flashlight}
        - {icon: battery, count: 2, label: batteries, cue: batteries}
      total: {text: "Log every hour till 6 AM", cue: six}
      say: "Two dome keys. One red flashlight, so your eyes stay used to the dark. Two spare batteries."
    - scene: room
      time: "2:00 AM"
      light: 85
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      dark: 0.4
      window_lights: [{x: 0.5, y: 0.8, color: "#ffd98a", cue: star, n: 1}]
      rule: {n: 3, text: "A new star? Tell nobody but Adair"}
      you: {x: 0.35, action: scared, facing: 1}
      heartbeat: star
      say: "At two AM, there's a new star. Rule number three. But it's wrong. It's low, below the tops of the hills, where no star can be. And it's flickering, like a flame."
    - scene: choice
      time: "2:01 AM"
      base: {scene: room, wall: "#3e4660", furniture: false, desk: true, clock: true, window_view: forest, dark: 0.4, window_lights: [{x: 0.5, y: 0.8, color: "#ffd98a", n: 1}]}
      question: "Look through the telescope or just log it?"
      options:
        - {text: Look, cue: look}
        - {text: Just log it, cue: log}
      say: "Do you point the telescope at it... or just log it, in red?"
    - scene: endcard
      time: "2:01 AM"
      hold: 1.6
      say: "Follow for night two."

- id: new-star-2
  format: stickman
  series: NEW STAR
  day: 2
  day_label: NIGHT
  meter_label: BATTERY
  place: KELDER HILL
  title: "The new star wasn't a star. It was a lantern. And something was holding it ⭐"
  tags: [stickman, animation, horror, story, observatory, stars]
  shots:
    - scene: room
      recap: true
      time: "2:01 AM"
      light: 84
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      dark: 0.4
      window_lights: [{x: 0.5, y: 0.8, color: "#ffd98a", n: 1}]
      say: "Last night, a new star appeared below the hills, where no star can be."
    - scene: title
      say: "New Star. Night two."
    - scene: room
      time: "2:02 AM"
      light: 83
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      dark: 0.45
      window_lights: [{x: 0.5, y: 0.8, color: "#ffd98a", n: 1}]
      you: {x: 0.5, action: reach, facing: 1}
      heartbeat: tall
      say: "You break rule two, and lower the telescope. It isn't a star. It's a lantern, held up high on the farthest hill. And holding it is something very tall, and very thin. Facing the observatory."
    - scene: radio
      time: "2:05 AM"
      on: radio
      radio_label: "RADIO · PROFESSOR ADAIR"
      say:
        - "You radio the professor. For a long time, he says nothing."
        - radio: "So it's back. Fifty years. Switch off every light in the dome. Don't let it see you."
    - scene: map
      time: "9:30 PM"
      place: KELDER VALLEY
      light: 98
      route: [[0.3, 0.98], [0.3, 0.3]]
      route_cue: 0
      route_end: closer
      stops:
        - {x: 0.3, y: 0.85, label: "Observatory", cue: 0}
        - {x: 0.3, y: 0.65, label: "Mill Hill", ghost: true, cue: closer}
        - {x: 0.3, y: 0.45, label: "Far Hill · night 1", cue: 0}
      say: "The next night, tonight's goal: track the light, hour by hour, with the dome dark. By midnight, it's moved. One whole hill closer. Mill Hill."
    - scene: room
      time: "3:00 AM"
      light: 80
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      dark: 0.7
      window_lights: [{x: 0.55, y: 0.7, color: "#ffd98a", n: 1}]
      you: {x: 0.4, action: scared, facing: 1}
      say: "At three, through the dark window, you can see it without the telescope. A lantern, swinging, as something walks."
    - scene: choice
      time: "3:01 AM"
      base: {scene: room, wall: "#3e4660", furniture: false, desk: true, clock: true, window_view: forest, dark: 0.7, window_lights: [{x: 0.55, y: 0.7, color: "#ffd98a", n: 1}]}
      question: "Ask Adair what it wants or keep hiding?"
      options:
        - {text: Ask Adair, cue: ask}
        - {text: Hide, cue: hiding}
      say: "Do you ask the professor what it wants... or keep hiding in the dark?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night three."

