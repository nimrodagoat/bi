  format: stickman
  series: NEW STAR
  day: 3
  day_label: NIGHT
  meter_label: BATTERY
  place: KELDER HILL
  title: "The professor said the light took his assistant in 1976. Her note said something else ⭐"
  tags: [stickman, animation, horror, story, observatory, stars]
  shots:
    - scene: room
      recap: true
      time: "3:01 AM"
      light: 78
      wall: "#3e4660"
      furniture: false
      desk: true
      clock: true
      window_view: forest
      dark: 0.7
      window_lights: [{x: 0.55, y: 0.7, color: "#ffd98a", n: 1}]
      say: "Last night, the new star turned out to be a lantern, carried by something tall. And every night, it's one hill closer."
    - scene: title
      say: "New Star. Night three."
    - scene: radio
      time: "3:02 AM"
      on: radio
      radio_label: "RADIO · PROFESSOR ADAIR"
      say:
        - "You ask Professor Adair what it wants."
        - radio: "In nineteen seventy six, it came for my assistant. Ruth. She went out to look at it, and she never came back. Stay inside."
    - scene: map
      time: "9:30 PM"
      place: OBSERVATORY LOG 1976
      light: 98
      route: [[0.3, 0.98], [0.3, 0.3]]
      route_cue: 0
      route_end: gone
      stops:
        - {x: 0.3, y: 0.85, label: "New star · 6 nights", cue: 0}
        - {x: 0.3, y: 0.65, label: "Assistant: R. Moore", cue: ruth}
        - {x: 0.3, y: 0.45, label: "Night 6: gone", ghost: true, cue: gone}
      say: "The next night, tonight's goal: find out what happened to Ruth. In the log from nineteen seventy six, the new star stayed six nights. Then the entries in Ruth's handwriting just stop."
    - scene: cctv
      time: "3:00 AM"
      cam: "CAM 02 · FRONT GATE"
      light: 82
      view: {scene: street, stop: 0, dark: 0.7, you: {x: -0.5}, people: [{x: 0.6, action: idle, facing: -1, color: "#cfc6b0", stare: true, cue: gate}]}
      heartbeat: gate
      say: "At three, the gate camera shows it. At the gate. A tall, thin shape, holding its lantern up high. It isn't trying to come in. It's waiting."
    - scene: cctv
      time: "3:05 AM"
      cam: "CAM 02 · FRONT GATE"
      light: 81
      view: {scene: street, stop: 0, dark: 0.7, you: {x: -0.5}}
      chip: {text: "Note: It's not here for you. It's here for him. Ruth, 1976", cue: note, y: 520}
      say: "When it leaves, there's a folded paper on the gate. Old. Yellow. In Ruth's handwriting. It's not here for you. It's here for him."
    - scene: choice
      time: "3:06 AM"
      base: {scene: cctv, cam: "CAM 02 · FRONT GATE", view: {scene: street, stop: 0, dark: 0.7, you: {x: -0.5}}}
      question: "Show Adair the note or keep it secret?"
      options:
        - {text: Show him, cue: show}
        - {text: Secret, cue: secret}
      say: "Do you show the professor the note... or keep it secret?"
    - scene: endcard
      time: "3:06 AM"
      hold: 1.6
      say: "Follow for night four."

