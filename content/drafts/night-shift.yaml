# NIGHT SHIFT (6 parts). You take the night guard job at Hollowbrook Mall.
# Cast: you (new guard), Frank (old guard, only on the radio), Ms. Reyes (manager).
# Core idea, said plainly: the mall copies its guards; if the copy walks your
# rounds for a week, it keeps your life. Each part opens with a one-line recap.
- id: night-shift-1
  format: stickman
  series: NIGHT SHIFT
  day: 1
  day_label: NIGHT
  cap: true
  meter_label: BATTERY
  place: HOLLOWBROOK MALL
  title: "I took the night guard job at an empty mall. Rule 1: never be late 🔦"
  tags: [stickman, animation, horror, nightshift, mall, story]
  shots:
    - scene: cctv
      time: "10:00 PM"
      cam: "CAM 01 · MAIN HALL"
      view: {scene: hallway, lights: "on", shops: true, wall: "#3f4650", floor: "#2a2d33", carpet: "#5b6068", ceiling: "#1e2126", exit_color: "#27d466"}
      say: "You take the night guard job at Hollowbrook Mall, because it pays three times more than anything else in town."
    - scene: room
      time: "10:05 PM"
      place: SECURITY OFFICE
      light: 100
      wall: "#5e6a72"
      furniture: false
      monitors: true
      desk: true
      clock: true
      you: {x: 0.3, action: idle, facing: 1}
      say: "Your manager, Ms. Reyes, hands you a key ring, a flashlight, and a list of rules. Then she says: follow every single one. And she leaves."
    - scene: title
      say: "Night shift. Night one."
    - scene: map
      time: "10:10 PM"
      route: [[0.08, 0.95], [0.08, 0.05], [0.92, 0.05], [0.92, 0.95], [0.08, 0.95]]
      route_cue: route
      route_end: hour
      target: {label: "Security office", cue: 0, icon: pin}
      rule: {n: 1, text: Rounds every hour}
      say: "Rule number one. Walk your rounds every hour, on the hour."
    - scene: hallway
      time: "11:00 PM"
      place: MAIN HALL
      light: 96
      lights: "on"
      shops: true
      wall: "#3f4650"
      floor: "#2a2d33"
      carpet: "#5b6068"
      ceiling: "#1e2126"
      exit_color: "#27d466"
      camera: {zoom: [1.0, 1.35], focus: [0.5, 0.45]}
      say: "At eleven, the mall is silent. Your footsteps echo all the way to the food court."
    - scene: room
      time: "11:20 PM"
      place: STORE 14
      light: 94
      wall: "#d9d2c7"
      dark: 0.55
      furniture: false
      door: false
      rule: {n: 2, text: Mannequins face the window}
      mannequins:
        - {x: 0.12, facing: -1}
        - {x: 0.3, facing: -1, turn: facing}
        - {x: 0.5, facing: -1}
      you: {x: 0.8, light: true, aim: 0.05, facing: -1}
      say: "Rule number two. In store fourteen, the mannequins always face the window. If one is ever facing you, walk out. Don't run. Don't look back."
    - scene: radio
      time: "12:00 AM"
      place: SECURITY OFFICE
      on: clicks
      chip: {text: "Frank · old guard · 20 years", cue: frank, y: 470}
      say:
        - "At midnight, your radio clicks. It's Frank, the old guard."
        - radio: "Did she give you the rules? Good. Whatever happens... never miss the three AM round."
    - scene: inventory
      time: "1:00 AM"
      light: 88
      items:
        - {icon: flashlight, count: 1, label: flashlight, cue: flashlight}
        - {icon: battery, count: 4, label: batteries, cue: four}
        - {icon: key, count: 12, label: keys, cue: twelve}
      total: {text: "6 hours to go", cue: six}
      say: "One flashlight. Four batteries. Twelve keys. Six hours until the doors unlock."
    - scene: closeup
      object: alarm
      time: "2:58 AM"
      place: RESTROOMS
      ring: late
      say: "At two fifty eight, you're at the far end of the mall. You're going to be late."
    - scene: cctv
      time: "3:02 AM"
      cam: "CAM 06 · OFFICE"
      light: 80
      src_y: 520
      view: {scene: room, wall: "#5e6a72", furniture: false, monitors: true, desk: true, you: {x: 0.42, action: idle, facing: 1, cap: true}}
      heartbeat: someone
      say: "You check the office camera on your phone. Someone is sitting in your chair. Wearing your uniform."
    - scene: choice
      time: "3:03 AM"
      base:
        scene: cctv
        cam: "CAM 06 · OFFICE"
        src_y: 520
        view: {scene: room, wall: "#5e6a72", furniture: false, monitors: true, desk: true, you: {x: 0.42, action: idle, facing: -1, cap: true}}
      question: "Go back or hide?"
      options:
        - {text: Go back, cue: back}
        - {text: Hide, cue: hide}
      say: "It turns and looks straight at the camera. Do you go back to your office... or hide until six?"
    - scene: endcard
      time: "3:03 AM"
      hold: 1.6
      say: "Follow for night two."

