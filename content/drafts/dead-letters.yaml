# DEAD LETTERS (6 parts). You are the night sorter at the old Wexley sorting
# office, ten PM to six AM.
# Cast: you (night sorter), Mrs. Penrose (the postmaster, on the phone), and the
# Courier: a quiet man in an old postman's cap who knocks at the back door at
# 3 AM and takes the Night Sack.
# The idea, said plainly: every letter anyone in Wexley writes and never posts
# turns up in the sorting office, with no stamp. Those go in the Night Sack, and
# the Courier keeps them until people are ready.
# Mid-story: you deliver one (Sam to his brother Tom, unsent since 1971) and it
# mends them; the Courier explains that he waits until people are ready.
# Twist: the Courier is Arthur Penrose, the old night sorter, who died last
# winter. In his loft is the letter Mrs. Penrose wrote the night he died and
# never posted. You hand it to him yourself (breaking rule 3); he reads it and
# finally goes. Sting: next night a stampless letter arrives addressed to you,
# in your own handwriting, dated ten years from now.
- id: dead-letters-1
  format: stickman
  series: DEAD LETTERS
  day: 1
  day_label: NIGHT
  meter_label: LAMP
  place: WEXLEY SORTING OFFICE
  title: "I'm the night sorter at an old post office. At 3 AM someone collects the letters with no stamp ✉️"
  tags: [stickman, animation, horror, story, post office, mystery]
  shots:
    - scene: room
      time: "10:00 PM"
      place: THE SORTING ROOM
      light: 100
      wall: "#6e5f4a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night job at the old Wexley sorting office. Ten PM to six AM. You sort the town's letters before the vans leave at five."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Mrs. Penrose · postmaster", cue: penrose, y: 470}
      radio_label: "PHONE · MRS. PENROSE"
      say:
        - "Mrs. Penrose, the postmaster, phones with the rules."
        - radio: "Three rules. Sort everything by five. Letters with no stamp go in the Night Sack, never the vans. And at three, give the sack to the man at the back door. Don't look inside it, and don't speak to him."
    - scene: title
      say: "Dead Letters. Night one."
    - scene: hallway
      time: "11:00 PM"
      place: THE RACKS
      light: 99
      lights: "on"
      shelves: true
      wall: "#6e5f4a"
      floor: "#3a3026"
      carpet: "#5a4a38"
      ceiling: "#2a231c"
      exit_color: "#ffe2a8"
      rule: {n: 1, text: Sort everything by 5 AM}
      say: "Rule number one. Every letter is sorted by five, when the vans leave. Long racks of little boxes, one for every street."
    - scene: room
      time: "1:00 AM"
      place: THE SORTING ROOM
      light: 97
      wall: "#6e5f4a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.45, action: idle, facing: 1}
      rule: {n: 2, text: "No stamp? Into the Night Sack"}
      say: "Rule number two. Letters with no stamp go in the Night Sack. Tonight there are three. Old paper. No stamp, no postmark, as if they were never posted at all. Tonight's goal: get to six."
    - scene: room
      time: "3:00 AM"
      light: 94
      wall: "#6e5f4a"
      furniture: false
      desk: true
      clock: true
      dark: 0.45
      door_open: [[false, 0], [true, opens]]
      you: {x: 0.35, action: idle, facing: 1}
      people: [{x: 0.8, action: idle, facing: -1, color: "#2c3a5a", cue: man}]
      rule: {n: 3, text: "Never look inside. Never speak."}
      sfx: [{name: knock, at: knock, gain: 0.7}]
      heartbeat: man
      say: "Rule number three. At three AM, a knock at the back door. It opens. A man in an old postman's cap stands in the fog. He doesn't say a word. He just holds out his hand for the sack."
    - scene: choice
      time: "3:01 AM"
      base: {scene: room, wall: "#6e5f4a", furniture: false, desk: true, clock: true, dark: 0.45, door_open: true, you: {x: 0.35, action: idle, facing: 1}, people: [{x: 0.8, action: idle, facing: -1, color: "#2c3a5a"}]}
      question: "Hand over the sack or keep it?"
      options:
        - {text: Hand it over, cue: hand}
        - {text: Keep it, cue: keep}
      say: "Do you hand over the sack... or keep it?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night two."

