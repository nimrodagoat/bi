      sfx: [{name: boom, at: thirteen}]
      say: "Tonight's goal: help him get closer. At the thirteenth chime, he climbs in. You tell him you want to help. He looks at you for a long time. Then he hands you the rope."
    - scene: room
      time: "3:40 AM"
      light: [90, 70]
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
