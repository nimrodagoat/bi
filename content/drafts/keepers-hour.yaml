# KEEPER'S HOUR (6 parts). You are the night keeper of the Marrow town hall
# clock, ten PM to six AM.
# Cast: you (night keeper), Agnes (the old town clerk, only on the phone), and
# the old keeper in the waistcoat, who only appears during the frozen hour.
# The idea, said plainly: at three AM the clock strikes an extra, thirteenth
# chime, and for one hour the whole town freezes. Only the keeper can move.
# Every night the old keeper climbs down the outside of the tower, a little
# further each hour, toward a girl hanging frozen in the air: she fell from the
# tower in 1962, and he stopped time to catch her. One hour a night is never
# quite enough.
# Twist: you help him, the two of you catch her together, and time starts
# again. Agnes, on the phone, says quietly: "I always wondered who the second
# pair of hands was." She was the girl.
- id: keepers-hour-1
  format: stickman
  series: KEEPER'S HOUR
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: MARROW TOWN HALL
  title: "I'm the night keeper of a town clock. At 3 AM it struck one extra chime 🕰️"
  tags: [stickman, animation, horror, story, clocktower, mystery]
  shots:
    - scene: room
      time: "10:00 PM"
      place: THE CLOCK ROOM
      light: 100
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night keeper job at Marrow town hall. Ten PM to six AM. One huge old clock, and a view over the sleeping town."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Agnes · town clerk", cue: agnes, y: 470}
      radio_label: "PHONE · AGNES"
      say:
        - "Agnes, the old town clerk, phones with the rules."
        - radio: "Three rules, dear. Wind the clock forty turns at midnight. Never stop the pendulum. And if it strikes thirteen, stay in the tower until the hour is over."
    - scene: title
      say: "Keeper's Hour. Night one."
    - scene: room
      time: "12:00 AM"
      light: 99
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      rule: {n: 1, text: Wind the clock forty turns at midnight}
      you: {x: 0.55, action: push, facing: 1}
      say: "Rule number one. At midnight, wind the clock with the big iron handle. Forty turns. Not thirty nine. Not forty one."
    - scene: hallway
      time: "12:30 AM"
      place: THE TOWER STAIRS
      light: 98
      lights: "on"
      wall: "#6b5e4e"
      floor: "#3a3228"
      carpet: "#4a4034"
      ceiling: "#241e18"
      exit_color: "#ffcf6e"
      rule: {n: 2, text: Never stop the pendulum}
      say: "Rule number two. The pendulum swings down the middle of the tower, longer than a bus. Never stop it. Not even for a second. Tonight's goal: keep it all ticking until six."
    - scene: room
      time: "3:00 AM"
      place: THE CLOCK ROOM
      light: 90
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      dark: 0.4
      rule: {n: 3, text: "If it strikes 13, stay in the tower"}
      you: {x: 0.4, action: scared, facing: 1}
      sfx: [{name: tick, at: one}, {name: tick, at: twelve}, {name: boom, at: thirteen}]
      heartbeat: thirteen
      say: "At three AM, the clock starts to strike. One. Two. You count. Eleven. Twelve. Rule number three. Then it strikes thirteen."
    - scene: street
      time: "3:00 AM"
      place: THE TOWN SQUARE
      light: 89
      stop: 0
      dark: 0.6
      you: {x: -0.5}
      people:
        - {x: 0.3, action: walk, facing: 1, color: "#b9b2a6"}
        - {x: 0.7, action: walk, facing: -1, color: "#b9b2a6"}
      say: "You look out of the clock face, down at the square. Everything has stopped. A man walking his dog, frozen mid step. Rain, hanging in the air like glass beads."
    - scene: choice
      time: "3:01 AM"
      base: {scene: street, stop: 0, dark: 0.6, you: {x: -0.5}, people: [{x: 0.3, action: walk, facing: 1, color: "#b9b2a6"}, {x: 0.7, action: walk, facing: -1, color: "#b9b2a6"}]}
      question: "Go down to the square or stay in the tower?"
      options:
        - {text: Go down, cue: down}
        - {text: Stay, cue: stay}
      say: "Do you go down to the frozen square... or stay in the tower?"
    - scene: endcard
      time: "3:01 AM"
      hold: 1.6
      say: "Follow for night two."

- id: keepers-hour-2
  format: stickman
  series: KEEPER'S HOUR
  day: 2
  day_label: NIGHT
  meter_label: BATTERY
  place: THE CLOCK ROOM
  title: "When the clock struck 13, the town froze. Then someone climbed out of the clock 🕰️"
  tags: [stickman, animation, horror, story, clocktower, mystery]
  shots:
    - scene: street
      recap: true
      time: "3:01 AM"
      place: THE TOWN SQUARE
      light: 88
      stop: 0
      dark: 0.6
      you: {x: -0.5}
      people:
        - {x: 0.3, action: walk, facing: 1, color: "#b9b2a6"}
        - {x: 0.7, action: walk, facing: -1, color: "#b9b2a6"}
      say: "Last night, the clock struck thirteen. And the whole town outside froze."
    - scene: title
      say: "Keeper's Hour. Night two."
    - scene: room
      time: "3:02 AM"
      place: THE CLOCK ROOM
      light: 87
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      dark: 0.4
      you: {x: 0.35, action: idle, facing: 1}
      people: [{x: 0.72, action: walk, facing: -1, color: "#8a6a4a", drift: -40, cue: climbs}]
      sfx: [{name: click, at: hatch}]
      say: "You stay in the tower. Rule three. Then a little hatch in the clock face opens, and an old man climbs in from outside. Waistcoat. Pocket watch. He's not frozen at all."
    - scene: room
      time: "3:05 AM"
      light: 86
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      dark: 0.4
      you: {x: 0.35, action: idle, facing: 1}
      people: [{x: 0.68, action: idle, facing: -1, color: "#8a6a4a"}]
      say: "He nods at you, as if he knew you'd be here. Only the keeper can move in the extra hour, he says. And I'm still the keeper. Then he picks up a coil of rope."
    - scene: room
      time: "3:30 AM"
      light: [84, 70]
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      dark: 0.45
      you: {x: 0.45, action: idle, facing: 1}
      say: "Tonight's goal: find out what he's doing before the hour ends. He ties the rope to the clock frame, and climbs back out through the hatch. Down the outside of the tower."
    - scene: room
      time: "3:59 AM"
      light: 68
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
      dark: 0.45
      you: {x: 0.6, action: reach, facing: 1}
      sfx: [{name: tick, at: tick}]
      heartbeat: tick
      say: "At one minute to four, the rope goes slack. The clock ticks. The hour is over. The rain starts falling again. And the old man is gone."
    - scene: choice
      time: "4:00 AM"
      base: {scene: room, wall: "#5a4a3a", furniture: false, desk: true, clock: true, dark: 0.45}
      question: "Ask Agnes or look out of the hatch?"
      options:
        - {text: Ask Agnes, cue: ask}
        - {text: Look out, cue: look}
      say: "Do you ask Agnes about him... or look out of the hatch?"
    - scene: endcard
      time: "4:00 AM"
      hold: 1.6
      say: "Follow for night three."

