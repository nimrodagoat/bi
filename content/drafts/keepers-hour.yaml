      on: phone
      radio_label: "PHONE · AGNES"
      say:
        - "You ask Agnes about nineteen sixty two. She is quiet for a very long time."
        - radio: "A little girl climbed the tower on a dare. She slipped. Everyone saw her fall. And then nobody remembers. That's all I know, dear."
    - scene: room
      time: "3:00 AM"
      light: 92
      wall: "#5a4a3a"
      furniture: false
      desk: true
      clock: true
