# ROOM EIGHT (6 parts). You are the night porter at the Salt House, a small
# seaside guesthouse, ten PM to six AM.
# Cast: you (night porter), Mrs. Abernathy (the owner, only on the phone), and
# Mr. Gale (a soaked man who comes to the letterbox at three AM asking for
# Room 8).
# The idea, said plainly: Room 8 "borrows" the night porter for one hour every
# night (you lose time, wake with sand on your shoes). Gale was the porter in
# 1952; it borrowed him until one night he never came back from the beach.
# Twist: you throw the Room 8 key into the sea and Gale is finally free. Then
# Mrs. Abernathy reveals Room 8 was holding the sea back from the town for
# seventy years, and one porter was the price. Sting: the tide starts coming
# in, and it isn't stopping.
- id: room-eight-1
  format: stickman
  series: ROOM EIGHT
  day: 1
  day_label: NIGHT
  meter_label: BATTERY
  place: THE SALT HOUSE
  title: "I'm the night porter at a seaside guesthouse. At 3 AM a soaked man asked for Room 8 🔑"
  tags: [stickman, animation, horror, story, guesthouse, seaside]
  shots:
    - scene: room
      time: "10:00 PM"
      light: 100
      wall: "#6a4f4a"
      furniture: false
      desk: true
      clock: true
      you: {x: 0.4, action: idle, facing: 1}
      say: "You take the night porter job at the Salt House, a little guesthouse by the sea. Ten PM to six AM. Eight rooms. One front desk. And the sound of waves all night."
    - scene: radio
      time: "10:05 PM"
      on: phone
      chip: {text: "Mrs. Abernathy · owner", cue: owner, y: 470}
      radio_label: "PHONE · MRS. ABERNATHY"
      say:
        - "Mrs. Abernathy, the owner, phones with the rules."
        - radio: "Three rules, love. No key without a name in the guestbook. Never give out the key to Room eight. And never open the front door after midnight."
    - scene: title
      say: "Room Eight. Night one."
    - scene: room
      time: "10:20 PM"
      light: 99
      wall: "#6a4f4a"
      furniture: false
      desk: true
      clock: true
      rule: {n: 1, text: No key without signing the guestbook}
      you: {x: 0.45, action: reach, facing: 1}
      say: "Rule number one. Every guest signs the guestbook before you hand them a key. No name, no room."
    - scene: hallway
      time: "10:40 PM"
      light: 98
      lights: "on"
      wall: "#7b5e52"
      floor: "#3a2a22"
      carpet: "#6e2b2b"
      ceiling: "#2a1f1a"
      exit_color: "#ffcf6e"
      rule: {n: 2, text: Never give out Room 8's key}
      say: "Rule number two. Room eight is at the end of the corridor. It's always booked. Nobody ever gets its key."
    - scene: street
      time: "11:00 PM"
      place: THE FRONT DOOR
      light: 97
      stop: 0
      sea: true
      dark: 0.6
      you: {light: true, facing: 1}
      rule: {n: 3, text: Never open the front door after midnight}
      say: "Rule number three. After midnight, the front door stays shut. If anyone comes, talk through the letterbox. Tonight's goal: keep all eight rooms safe until six."
    - scene: street
      time: "3:00 AM"
      light: 85
      stop: 0
      sea: true
      dark: 0.7
      you: {light: true, facing: 1}
      people: [{x: 0.68, action: knock, facing: -1, color: "#8fa3b0", cue: bell}]
      sfx: [{name: knock, at: bell}]
      heartbeat: dripping
      say: "At three AM, the bell rings. Through the letterbox you see a man in a long coat, soaking wet, dripping sea water on the step."
    - scene: street
      time: "3:01 AM"
      light: 84
      stop: 0
      sea: true
      dark: 0.7
      you: {light: true, facing: 1}
      people: [{x: 0.68, action: idle, facing: -1, color: "#8fa3b0"}]
      say: "He smiles politely. Gale. I'm booked into Room eight."
    - scene: choice
      time: "3:02 AM"
      base: {scene: street, stop: 0, sea: true, dark: 0.7, you: {light: true, facing: 1}, people: [{x: 0.68, action: idle, facing: -1, color: "#8fa3b0"}]}
      question: "Give him the key or send him away?"
      options:
        - {text: Give the key, cue: give}
        - {text: Send away, cue: away}
      say: "Do you give him the key... or send him away?"
    - scene: endcard
      time: "3:02 AM"
      hold: 1.6
      say: "Follow for night two."

