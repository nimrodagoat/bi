# ─────────────────────────────────────────────────────────────
#  YouTube Shorts autopilot — settings
#  Change anything here and push; the next daily run uses it.
# ─────────────────────────────────────────────────────────────

channel:
  # The default topic for new videos. Each video in content/queue.yaml can
  # override this with its own "niche:" line.
  niche: "Text message storytimes"
  language: en

schedule:
  # How many videos to post each time the job runs (it runs 6 times a day).
  # YouTube's free API quota allows about 6 uploads per day in total.
  uploads_per_run: 1
  # The job warns in its log when fewer videos than this are left in the queue.
  low_queue_warning: 7

upload:
  # public | unlisted | private
  # NOTE: until your Google Cloud project passes YouTube's (free) API audit,
  # YouTube forces every API upload to private, whatever this says.
  privacy: public
  category_id: "24"        # 24 = Entertainment, 27 = Education, 22 = People & Blogs
  made_for_kids: false
  extra_tags: ["shorts"]   # added to every video's own tags
  # Hashtags in every description, after the story's own tags (max_hashtags in total).
  hashtags: [textstory, textingstory, storytime, texts, minecraftparkour, viral, fyp]
  max_hashtags: 15
  title_hashtags: [textstory, shorts]   # added to the title when it fits in 100 characters

voice:
  # Tried in order until one works:
  #   edge   = free Microsoft Edge neural voices (needs internet)
  #   kokoro = free open-source neural voices, downloaded once (~350 MB)
  #   piper  = free open-source voice, downloaded once (plainer)
  #   espeak = robotic offline voice (only for local testing)
  # Characters (below) have their own voices; these are for narrated videos.
  engines: [edge, kokoro, piper]
  edge_voice: en-US-AndrewNeural   # others: en-US-AvaNeural, en-GB-RyanNeural, en-US-BrianNeural
  edge_rate: "+8%"                 # speed: "-10%" slower, "+15%" faster
  piper_voice: en_US-ryan-high

visuals:
  # auto     = your own gameplay videos if there are any (see SETUP.md, "Gameplay"),
  #            otherwise generated Minecraft-style parkour (parkour: true),
  #            otherwise free stock videos matching each video's search_terms from
  #            Pixabay (PIXABAY_API_KEY) or Pexels (PEXELS_API_KEY),
  #            otherwise an animated colour background
  # gameplay / parkour / pixabay / pexels / gradient = force one of these
  source: auto
  gameplay_dir: assets/gameplay
  # Credit lines added to the description when a gameplay clip is used.
  gameplay_credits:
    minecraft-parkour.mp4: "Gameplay: @rephyr2000 on TikTok"
  parkour: true
  parkour_fov: 96               # camera field of view in degrees
  parkour_render_scale: 0.75    # lower = faster rendering, softer picture
  # Darkens the background so captions stay readable (0 = none, 1 = black).
  dim: 0.35
  gameplay_dim: 0.15

# The two characters who talk in "dialogue" videos. The keys (dave, pip) are
# what the queue uses as speaker names.
#   voices: edge_voice (Microsoft Edge, free) is tried first, then kokoro_voice
#           (Kokoro, free open-source). Hear all options: run a test in GitHub
#           Actions and download the "voice-samples" files.
#   expressions: one picture per face; the speaking character switches between
#           them. "reactions" picks the first face for questions/exclamations.
#   Art: "Notionists" by Zoish (public domain); restyle with tools/characters.mjs.
characters:
  dave:
    name: Dave
    engines: [edge, kokoro]
    edge_voice: en-US-AndrewMultilingualNeural
    edge_rate: "+8%"
    kokoro_voice: am_puck   # backup if Edge is down
    kokoro_speed: 1.05
    espeak_voice: en-us     # robotic offline voice, local testing only
    color: "#FF5C5C"        # outline + his words light up red
    outfit: {pants: "#4a6fa5", belt: true}   # jeans
    side: left
    expressions:
      neutral: assets/characters/dave/neutral.png
      excited: assets/characters/dave/excited.png
      shocked: assets/characters/dave/shocked.png
      confused: assets/characters/dave/confused.png
      goofy: assets/characters/dave/goofy.png
    reactions:
      question: confused
      exclaim: shocked
  pip:
    name: Pip
    engines: [kokoro, edge]
    kokoro_voice: bm_lewis
    kokoro_speed: 1.05
    edge_voice: en-GB-RyanNeural  # backup if Kokoro fails
    edge_rate: "+4%"
    espeak_voice: en-gb
    color: "#4CC9F0"        # outline + his words light up blue
    outfit: {pants: "#c2a878", belt: true}   # khakis
    side: right
    expressions:
      explaining: assets/characters/pip/explaining.png
      smug: assets/characters/pip/smug.png
      factcheck: assets/characters/pip/factcheck.png
      unimpressed: assets/characters/pip/unimpressed.png
      surprised: assets/characters/pip/surprised.png
    reactions:
      question: smug
      exclaim: surprised
  grug:
    name: Grug
    engines: [kokoro, edge]
    kokoro_voice: am_onyx   # deep and slow
    kokoro_speed: 0.92
    edge_voice: en-US-RogerNeural
    espeak_voice: en-us
    color: "#F4A261"        # outline + his words light up orange
    outfit: {pelt: true}    # fur tunic instead of shirt and trousers
    side: left
    expressions:
      neutral: assets/characters/grug/neutral.png
      amazed: assets/characters/grug/amazed.png
      confused: assets/characters/grug/confused.png
      grumpy: assets/characters/grug/grumpy.png
      happy: assets/characters/grug/happy.png
    reactions:
      question: confused
      exclaim: amazed
  nova:
    name: Nova
    engines: [kokoro, edge]
    kokoro_voice: af_heart
    kokoro_speed: 1.05
    edge_voice: en-US-AvaMultilingualNeural
    espeak_voice: en-us
    color: "#B388FF"        # outline + her words light up purple
    outfit: {pants: "#3d3d5c", belt: true}
    side: right
    expressions:
      explaining: assets/characters/nova/explaining.png
      laughing: assets/characters/nova/laughing.png
      smug: assets/characters/nova/smug.png
      timecheck: assets/characters/nova/timecheck.png
      surprised: assets/characters/nova/surprised.png
    reactions:
      question: smug
      exclaim: surprised

captions:
  font: "DejaVu Sans"
  font_size: 92
  words_per_caption: 3
  color: "#FFFFFF"
  highlight_color: "#FFE600"   # colour of the word being spoken
  position_from_bottom: 1150   # pixels from the bottom of the 1920px-tall frame

video:
  width: 1080
  height: 1920
  fps: 30
  # Seconds of silence after the voice ends.
  tail_seconds: 0.6
  # How often a talking character changes expression.
  expression_seconds: 1.6
  # How often the stock footage cuts to a new clip (gameplay doesn't cut).
  scene_seconds: 2.5

music:
  # Free meme music heard under countless viral videos, by Kevin MacLeod
  # (incompetech.com), licensed CC BY 4.0: free to use in monetized videos as long
  # as he's credited. The credit is added to each video's description automatically.
  # Each video gets one of these at random. Your own tracks in assets/music/
  # (e.g. from the YouTube Audio Library) are used instead if there are any.
  tracks:
    - Sneaky Snitch
    - Monkeys Spinning Monkeys
    - Fluffing a Duck
    - Scheming Weasel faster
    - Investigations
    - Run Amok
    - Pixel Peeker Polka - faster
    - Electrodoodle
    - Carefree
    - Local Forecast - Elevator
  volume: 0.14            # how loud the music is under the voices (0-1)

# Text-message stories ("messages:" in the queue): an iMessage-style chat over
# gameplay. Every message is read out by a voice as it appears.
chat:
  top: 470            # where the chat panel starts, pixels from the top (of 1920)
  width: 0.70         # panel width, as a share of the video width
  max_height: 900     # older messages scroll off the top beyond this
  font_size: 33
  gap_seconds: 0.3    # pause between messages
  time: "Today 3:42 PM"
  music: false        # true = also play background music under the story
  me: male            # default voice types; a story can set me: / them: itself
  them: female
  # Each voice type is a pool; every video picks one voice from the pool (and the
  # two sides never get the same voice), so the channel doesn't sound repetitive.
  voices:
    male:
      - {engines: [edge, kokoro], edge_voice: en-US-AndrewMultilingualNeural, edge_rate: "+5%", kokoro_voice: am_michael}
      - {engines: [edge, kokoro], edge_voice: en-US-ChristopherNeural, edge_rate: "+5%", kokoro_voice: am_eric}
      - {engines: [edge, kokoro], edge_voice: en-US-SteffanNeural, edge_rate: "+5%", kokoro_voice: am_liam}
      - {engines: [kokoro, edge], kokoro_voice: am_fenrir, edge_voice: en-US-EricNeural}
      - {engines: [kokoro, edge], kokoro_voice: am_michael, edge_voice: en-US-AndrewMultilingualNeural}
    female:
      - {engines: [kokoro, edge], kokoro_voice: af_heart, kokoro_speed: 1.05, edge_voice: en-US-AvaMultilingualNeural}
      - {engines: [edge, kokoro], edge_voice: en-US-AvaMultilingualNeural, edge_rate: "+5%", kokoro_voice: af_sarah}
      - {engines: [kokoro, edge], kokoro_voice: af_sarah, kokoro_speed: 1.05, edge_voice: en-US-EmmaMultilingualNeural}
      - {engines: [kokoro, edge], kokoro_voice: af_kore, kokoro_speed: 1.05, edge_voice: en-US-AvaMultilingualNeural}
      - {engines: [kokoro, edge], kokoro_voice: bf_emma, kokoro_speed: 1.05, edge_voice: en-US-AvaMultilingualNeural}
    young_male:
      - {engines: [edge, kokoro], edge_voice: en-US-BrianMultilingualNeural, edge_rate: "+10%", kokoro_voice: am_puck}
      - {engines: [kokoro, edge], kokoro_voice: am_puck, kokoro_speed: 1.08, edge_voice: en-US-BrianMultilingualNeural}
      - {engines: [edge, kokoro], edge_voice: en-US-EricNeural, edge_rate: "+10%", kokoro_voice: am_echo}
      - {engines: [kokoro, edge], kokoro_voice: am_liam, kokoro_speed: 1.08, edge_voice: en-US-SteffanNeural}
    young_female:
      - {engines: [edge, kokoro], edge_voice: en-US-EmmaMultilingualNeural, edge_rate: "+8%", kokoro_voice: af_bella}
      - {engines: [kokoro, edge], kokoro_voice: af_bella, kokoro_speed: 1.08, edge_voice: en-US-EmmaMultilingualNeural}
      - {engines: [kokoro, edge], kokoro_voice: af_sky, kokoro_speed: 1.08, edge_voice: en-US-EmmaMultilingualNeural}
      - {engines: [kokoro, edge], kokoro_voice: bf_isabella, kokoro_speed: 1.08, edge_voice: en-US-EmmaMultilingualNeural}
    old_male:
      - {engines: [kokoro, edge], kokoro_voice: bm_george, kokoro_speed: 0.95, edge_voice: en-GB-RyanNeural}
      - {engines: [kokoro, edge], kokoro_voice: bm_daniel, kokoro_speed: 0.95, edge_voice: en-GB-RyanNeural}
      - {engines: [edge, kokoro], edge_voice: en-GB-RyanNeural, edge_rate: "-5%", kokoro_voice: bm_george}
      - {engines: [edge, kokoro], edge_voice: en-US-RogerNeural, edge_rate: "-5%", kokoro_voice: bm_daniel}
    deep_male:
      - {engines: [kokoro, edge], kokoro_voice: am_onyx, kokoro_speed: 0.95, edge_voice: en-US-RogerNeural}
      - {engines: [edge, kokoro], edge_voice: en-US-RogerNeural, kokoro_voice: am_onyx}
      - {engines: [kokoro, edge], kokoro_voice: am_fenrir, kokoro_speed: 0.95, edge_voice: en-US-ChristopherNeural}
